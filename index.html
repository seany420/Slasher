function damageKiller(dmg,fx,fy){
  if(K.st==='DOWN')return;
  if(K.fin){const f=K.fin;if(f.t<f.dur*f.hit){f.v.fin=false;K.fin=null}}
  K.dmg+=dmg;K.stun=Math.max(K.stun,0.6);
  blood(K.x,K.y-6,12);addStain(K.x,K.y+4,3);noiseHit(0.2,0.1);
  const dx=K.x-fx,dy=K.y-fy,m=Math.hypot(dx,dy)||1;
  tryMove(K,dx/m*6,dy/m*6,4,6,!!S().water);
  if(K.dmg>=K.thresh){
    K.st='DOWN';K.downT=11;K.dmg=0;K.thresh+=4;K.downs++;stats.downs++;K.sab=null;K.fin=null;
    blood(K.x,K.y,40,true);addStain(K.x,K.y,9);sfxDown();shake=6;
    msg("HE'S DOWN. HE WON'T STAY DOWN.",3);
  }
}
function completeAct(c){
  const a=c.act;c.act=null;
  const take=it=>{const i=c.inv.indexOf(it);if(i>=0){c.inv.splice(i,1);return true}return false};
  switch(a.k){
    case 'SEARCH':if(a.ref&&!a.ref.searched)revealCont(a.ref,c);break;
    case 'INSTALL':
      if(EX.car.parts[a.item]===false&&take(a.item)){EX.car.parts[a.item]=true;
        announce(c,carReady()?'THE CAR IS READY! GET TO THE CAR!':'THE '+a.item+' IS IN THE CAR.',3.5);
        if(mode===0)sfxKeyItem()}
      break;
    case 'FUSE':if(take('FUSE')){EX.cops.fuse=true;EX.cops.power=true;sfxHum();
      announce(c,'THE POWER IS ON! SOMEONE CALL!',3.5)}break;
    case 'RESTART':if(!EX.cops.power){EX.cops.power=true;sfxHum();announce(c,'POWER IS BACK!',3)}break;
    case 'CALL':if(EX.cops.power&&!EX.cops.called&&EX.cops.cut<=0){EX.cops.called=true;
      EX.cops.t=mode===1?45:D().cops;sfxRing();announce(c,'I CALLED THE POLICE! HOLD ON!',3.5)}break;
    case 'GATE':if(!EX.gate.open&&take('GATE KEY')){openGate();announce(c,'THE GATE IS OPEN! GO NORTH!',3.5)}break;
    case 'BOATKEY':if(!EX.boat.key&&take('BOAT KEY')){EX.boat.key=true;announce(c,'THE BOAT IS READY!',3.5)}break;
    case 'HATCH':if(!EX.hatch.open&&take('HATCH KEY')){EX.hatch.open=true;sfxDoor();announce(c,'THE HATCH IS OPEN!',3.5)}break;
    case 'REVIVE':{
      const t=a.ref;
      if(t===P&&P.down&&!P.fin){P.down=false;P.hp=2;msg(c.name+' GOT YOU UP!',3);sfxPickup()}
      else if(t&&t.down&&!t.dead&&!t.fin){t.down=false;t.hp=1;t.fleeT=0;say(t,'THANKS...');say(c,'UP! MOVE!')}
      break}
    case 'HEAL':if(c.med>0){c.med--;c.hp=Math.min(c.maxhp,c.hp+2)}break;
  }
  releaseGoal(c);c.goal=null;c.think=0;
}
const ACT_NOISE={SEARCH:'search',INSTALL:'install',FUSE:'fuse',RESTART:'restart',CALL:'call',GATE:'gate',
  BOATKEY:'boatkey',HATCH:'hatch',REVIVE:'revive',HEAL:'search'};
function humanUpdate(c,dt){
  if(c.dead||c.escaped||c.fin)return;
  c.hurtCd=Math.max(0,c.hurtCd-dt);c.atkCd=Math.max(0,c.atkCd-dt);c.sayCd-=dt;
  c.swingT=Math.max(0,(c.swingT||0)-dt);
  if(c.say){c.say.d-=dt;if(c.say.d<=0)c.say=null}
  c.panic=Math.max(0,c.panic-dt);
  c.fleeT=Math.max(0,c.fleeT-dt);
  const th=threat(),td=Math.hypot(th.x-c.x,th.y-c.y);
  if(c.down){
    c.downT-=dt;
    if(Math.random()<dt*3)addStain(c.x+rr(-3,3),c.y+rr(0,3),rr(1,2.5));
    if(th.on&&!th.busy&&td<150){const m=td||1;
      tryMove(c,(c.x-th.x)/m*9*dt,(c.y-th.y)/m*9*dt,4,5,false);c.moving=true;c.walkT+=dt*3}
    else c.moving=false;
    if(c.downT<=0){msg(c.name+' BLED OUT.',3);killHuman(c,'whole',1)}
    return;
  }
  if(c.hide){
    c.hideT-=dt;
    if(c.hideT<=0&&(!th.on||td>130))unhideH(c);
    return;
  }
  if(!c.alarmed){
    let why=null;
    if(th.on&&td<120&&sightLOS(c.x,c.y-6,th.x,th.y-6))why="WHO'S THAT?!";
    for(const n of noises)if(n.pri>=1&&Math.hypot(n.x-c.x,n.y-c.y)<n.r){why='WHAT WAS THAT?!';break}
    for(const k of corpses)if(Math.hypot(k.x-c.x,k.y-c.y)<46){why='OH MY GOD! '+k.name+'!';break}
    if(why){alarm(c,why)}
    else{calmUpdate(c,dt);return}
  }
  if(EX.hatch.on&&!EX.hatch.found&&Math.hypot(c.x-hatch.x,c.y-hatch.y)<40){
    EX.hatch.found=true;announce(c,"THERE'S A HATCH OUT HERE!",3.5)}
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];if(pk.t>0)continue;
    if(Math.hypot(c.x-pk.x,c.y-pk.y)<11&&npcTakePickup(c,pk))pickups.splice(i,1);
  }
  if(th.on&&!th.busy&&c.weapon&&td<16&&c.atkCd<=0&&Math.random()<0.6){fightBack(c);if(state!==1)return}
  if(c.act){
    const seen=th.on&&!th.busy&&td<75&&(td<30||sightLOS(c.x,c.y-6,th.x,th.y-6));
    if(seen){c.act=null;c.fleeT=3;releaseGoal(c);c.goal=null;c.think=0}
    else{
      c.act.t+=dt;c.moving=false;
      c.noiseT=(c.noiseT||0)-dt;
      if(c.noiseT<=0){c.noiseT=0.6;noise(c.x,c.y,(CHAN_NOISE[ACT_NOISE[c.act.k]]||40)*0.9)}
      if(c.act.t>=c.act.dur)completeAct(c);
      return;
    }
  }
  c.think-=dt;
  if(c.think<=0){c.think=0.3+Math.random()*0.25;decide(c,th,td)}
  moveHuman(c,dt,th,td);
}
function moveHuman(c,dt,th,td){
  const g=c.goal;
  if(!g){c.moving=false;return}
  let sp=46*(mode===1?D().cSpd:1)*(mode===0&&has('LEADER')?1.1:1);
  if(g.k==='FLEE'||c.panic>0){
    if(c.stam>8){sp*=1.5;c.stam=Math.max(0,c.stam-26*dt*(mode===1&&has('DREAD')&&td<110?1.6:1))}
  }else c.stam=Math.min(100,c.stam+12*dt);
  if(c.hp<=1)sp*=0.85;
  const startAct=()=>{
    const big=['INSTALL','FUSE','GATE','BOATKEY','HATCH','RESTART','CALL'].includes(g.k);
    c.act={k:g.k,t:0,dur:g.dur*(mode===1&&big?2.2:1),ref:g.ref,item:g.item};c.moving=false;
    if(mode===1&&big){
      const where={INSTALL:'THE CAR',FUSE:'THE GENERATOR',RESTART:'THE GENERATOR',CALL:'THE PHONE',
        GATE:'THE GATE',BOATKEY:'THE BOAT',HATCH:'THE HATCH'}[g.k];
      msg('SOMEONE IS AT '+where+'!',3);alerts.push({x:c.x,y:c.y,t:8,c:c});
    }
  };
  switch(g.k){
    case 'FLEE':
      if(navTo(c,g.x,g.y,dt,sp,false))c.think=0;
      break;
    case 'HEAL':startAct();break;
    case 'REVIVE':{
      const t=g.ref;
      if(!t||!t.down||t.dead){c.goal=null;c.think=0;break}
      if(Math.hypot(t.x-c.x,t.y-c.y)<14)startAct();
      else navTo(c,t.x,t.y,dt,sp*1.15,false);
      break}
    case 'ESCAPE':{
      const arrived=navTo(c,g.x,g.y,dt,sp*1.1,false)||Math.hypot(g.x-c.x,g.y-c.y)<10;
      if(!arrived)break;
      c.moving=false;
      if(g.ex==='COPS'||g.ex==='GATE'||g.ex==='HATCH'){escapeHuman(c,g.ex);break}
      c.waitT+=dt;
      if(c.waitT>1&&!c.waitSaid){c.waitSaid=true;
        if(mode===0)announce(c,g.ex==='CAR'?"I'M AT THE CAR! COME ON!":"I'M AT THE BOAT! HURRY!",3)}
      const danger=th.on&&!th.busy&&td<110;
      if(mode===1){if(c.waitT>4||danger)vehicleLeave(g.ex,c)}
      else if(c.waitT>28&&(danger||nightProg()>0.9))vehicleLeave(g.ex,c);
      else if(c.waitT>55)vehicleLeave(g.ex,c);
      break}
    case 'INSTALL':case 'FUSE':case 'GATE':case 'BOATKEY':case 'HATCH':
      if(!c.inv.includes(g.item)||!useGoal(g.item)){c.goal=null;c.think=0;break}
      if(navTo(c,g.x,g.y,dt,sp,false))startAct();
      break;
    case 'RESTART':case 'CALL':
      if(navTo(c,g.x,g.y,dt,sp,false))startAct();
      break;
    case 'SEARCH':
      if(g.ref.searched||g.ref.occ){releaseGoal(c);c.goal=null;c.think=0;break}
      if(navTo(c,g.x,g.y,dt,sp,false)||Math.hypot(g.x-c.x,g.y-c.y)<8)startAct();
      else if(c.stuckN>6){g.ref.claim=null;g.ref.badFor=c;c.goal=null;c.think=0;c.stuckN=0}
      break;
    case 'PICKUP':{
      const i=pickups.indexOf(g.ref);
      if(i<0){c.goal=null;c.think=0;break}
      if(navTo(c,g.x,g.y,dt,sp,false)||Math.hypot(g.x-c.x,g.y-c.y)<10){
        if(npcTakePickup(c,g.ref))pickups.splice(i,1);
        g.ref.claim=null;c.goal=null;c.think=0;
      }
      break}
    case 'HIDE':{
      const h=g.ref;
      if(h.occ){c.goal=null;c.think=0;break}
      if(navTo(c,g.x,g.y,dt,sp,false)||Math.hypot(g.x-c.x,g.y-c.y)<8){
        c.hide=h;h.occ=c;c.hideT=rr(7,15);c.moving=false;c.goal=null;
        if(mode===0&&K.st==='CHASE'&&K.tgt===c&&Math.hypot(K.x-c.x,K.y-c.y)<110&&
          sightLOS(K.x,K.y-8,c.x,c.y-6))K.yank=h;
      }
      break}
    case 'FOLLOW':{
      const d=Math.hypot(P.x-c.x,P.y-c.y);
      if(d>46){if(!g.ox||Math.random()<0.01){g.ox=rr(-20,20);g.oy=rr(-14,14)}
        navTo(c,P.x+g.ox,P.y+g.oy,dt,sp*(d>120?1.3:1),false)}
      else c.moving=false;
      break}
    case 'ROAM':
      if(!g.tx||Math.hypot(g.tx-c.x,g.ty-c.y)<10||(g.t=(g.t||0)+dt)>10){
        const s=openSpot(4,MH-6,th.on?140:0,th.on?th:null);g.tx=s.x;g.ty=s.y;g.t=0}
      navTo(c,g.tx,g.ty,dt,sp*0.8,false);
      break;
  }
  if(c.moving){
    c.walkT+=dt*8;
    // bloody footprints
    const ti=Math.floor(c.y/T)*MW+Math.floor(c.x/T);
    if(bloodG[ti]>40)c.bloodSteps=8;
    c.stepT-=dt;
    if(c.stepT<=0){c.stepT=0.3;
      if(c.bloodSteps>0){c.bloodSteps--;decals.push({k:'fp',x:c.x+((c.walkT|0)%2?2:-2),y:c.y+5});if(decals.length>300)decals.shift()}
      if(g.k==='FLEE')noise(c.x,c.y,60)}
  }
}

/* ---------------- THE SLASHER (survive mode) ---------------- */
function killerTargets(){
  const t=[];
  if(!P.hide&&!P.escaped&&!P.fin)t.push(P);
  for(const c of npcs)if(!c.hide&&!c.dead&&!c.escaped&&!c.fin)t.push(c);
  return t;
}
function litAt(x,y){
  for(const L of lamps)if(Math.hypot(L.x-x,L.y-y)<50)return true;
  return false;
}
function kPerceive(){
  const d=D(),lv=lvl();
  let sight=(d.sight+lv*6)*(weather==='FOG'?0.72:1);
  if(lightFlash>0)sight*=1.6;
  let best=null,bs=1e9;
  const bk=buildingAt(K.x,K.y);
  for(const t of killerTargets()){
    const dd=Math.hypot(t.x-K.x,t.y-K.y);
    let sr=sight;
    if(t===P){if(P.torch&&P.torchOn)sr*=1.3;if(P.sprinting)sr*=1.12;if(P.down)sr*=1.2}
    else if(t.lantern)sr*=1.15;
    if(EX.cops.power&&litAt(t.x,t.y))sr*=1.25;
    if(buildingAt(t.x,t.y)!==bk)sr*=0.55;
    if(dd>sr)continue;
    if(dd>22&&!sightLOS(K.x,K.y-8,t.x,t.y-6))continue;
    const sc=dd*(t===P?0.85:1)*(t.down?0.6:1);
    if(sc<bs){bs=sc;best=t}
  }
  if(best){
    if(best.down){K.st='FINISH';K.fv=best;return}
    if(best===P&&(K.tgt!==P||K.st!=='CHASE')){
      if(!K.spotted)msg('HE SEES YOU.',2);
      sfxSting();K.spotted=true;
    }
    K.tgt=best;K.st='CHASE';K.lostT=0;K.lkx=best.x;K.lky=best.y;K.yank=null;
    return;
  }
  if(K.st==='CHASE'){K.lostT+=0.2;if(K.lostT>3.5){K.st='SEARCH';K.searchT=5;K.wp=null}}
  if(K.st!=='FINISH'&&K.st!=='CHASE'){
    let dv=null,dd=300;
    for(const c of npcs)if(c.down&&!c.fin&&!c.dead){const q=Math.hypot(c.x-K.x,c.y-K.y);if(q<dd){dd=q;dv=c}}
    if(P.down&&!P.fin&&Math.hypot(P.x-K.x,P.y-K.y)<420)dv=P;
    if(dv){K.st='FINISH';K.fv=dv;return}
  }
  if(K.yank&&K.st!=='CHASE'&&K.st!=='FINISH'){K.st='YANK';return}
  if(K.st!=='FINISH'&&K.st!=='CHASE'&&K.st!=='YANK'){
    let bn=null,bp=-1;
    for(const n of noises){const q=Math.hypot(n.x-K.x,n.y-K.y);
      if(q<n.r*d.hear&&n.pri>=bp){bp=n.pri;bn=n}}
    if(bn&&(K.st!=='INVESTIGATE'||bn.pri>=1||K.invT<1)){
      K.st='INVESTIGATE';K.ix=bn.x;K.iy=bn.y;K.invT=bn.pri>=2?6:3;
    }
  }
  K.sabCd-=0.2;
  if(K.st==='PATROL'&&K.sabCd<=0){
    K.sabCd=d.sab*rr(0.8,1.2);
    const opts=[];
    const ninst=Object.values(EX.car.parts).filter(Boolean).length;
    if(EX.car.on&&!EX.car.gone&&ninst>=1)opts.push({k:'car',x:car.ax,y:car.ay});
    if(EX.cops.power&&!EX.cops.called&&gen.tx)opts.push({k:'gen',x:gen.ax,y:gen.ay});
    if(EX.boat.on&&EX.boat.key&&!EX.boat.gone)opts.push({k:'boat',x:boat.ax,y:boat.ay});
    if(opts.length){K.sab=pick(opts);K.st='SAB'}
  }
}
function killerTeleport(){
  for(let tr=0;tr<50;tr++){
    const a=Math.random()*Math.PI*2,d2=110+Math.random()*50;
    const nx=P.x+Math.cos(a)*d2,ny=P.y+Math.sin(a)*d2;
    const tx=Math.floor(nx/T),ty=Math.floor(ny/T);
    if(nx>3*T&&ny>3*T&&nx<WPX-3*T&&ny<HPX-5*T&&freeBox(nx,ny,4,6,false)&&reach[ty*MW+tx]&&
      !sightLOS(P.x,P.y-6,nx,ny-8)){
      K.x=nx;K.y=ny;K.path=null;smoke(K.x,K.y-6,10);return true;
    }
  }
  return false;
}
function updateKiller(dt){
  const s=S(),d=D(),lv=lvl();
  if(K.fin){updateFin(K.fin,dt);return}
  if(K.st==='DOWN'){
    K.downT-=dt;K.moving=false;
    if(K.downT<=0){K.st='SEARCH';K.searchT=3;K.lkx=P.x;K.lky=P.y;K.riseFlash=1;
      sfxSting();msg('HE IS UP AGAIN.',2.5)}
    return;
  }
  K.stun=Math.max(0,K.stun-dt);K.riseFlash=Math.max(0,K.riseFlash-dt);
  K.atkCd=Math.max(0,K.atkCd-dt);K.lungeCd-=dt;K.rageCd-=dt;
  K.lungeT=Math.max(0,K.lungeT-dt);K.rageT=Math.max(0,K.rageT-dt);K.swingT=Math.max(0,K.swingT-dt);
  for(let i=traps.length-1;i>=0;i--){
    const tp=traps[i];
    if(Math.hypot(K.x-tp.x,K.y-tp.y)<9){
      traps.splice(i,1);K.stun=4;K.dmg+=2;K.sab=null;
      blood(K.x,K.y,20);addStain(K.x,K.y,5);sfxSnap();msg('SNAP! HE IS CAUGHT!',2.5);
    }
  }
  if(K.stun>0){K.moving=false;return}
  K.perT-=dt;if(K.perT<=0){K.perT=0.2;kPerceive()}
  const enr=EX.cops.called&&!EX.cops.here;
  const kf=d.kSpd*Math.min(1.35,1+0.035*lv);
  const chaseSpd=s.chase*kf+nightProg()*10+K.downs*3+(enr?8:0);
  const stalkSpd=s.stalk*kf+nightProg()*6+(enr?6:0);
  let gx=K.x,gy=K.y,spd=0;
  switch(K.st){
    case 'CHASE':{
      const t=K.tgt;
      if(!t||t.dead||t.escaped||t.fin||(t.hide&&K.yank!==t.hide)){K.st='SEARCH';K.searchT=4;K.wp=null;break}
      if(K.lostT>0){gx=K.lkx;gy=K.lky;
        if(Math.hypot(gx-K.x,gy-K.y)<8){K.st='SEARCH';K.searchT=4;K.wp=null}}
      else{gx=t.x;gy=t.y}
      spd=chaseSpd;
      const dd=Math.hypot(t.x-K.x,t.y-K.y);
      if(s.power==='LUNGE'&&K.lungeCd<=0&&dd>26&&dd<75&&K.lostT===0){K.lungeT=0.35;K.lungeCd=8*d.tp+2;sfxPower()}
      if(s.power==='RAGE'&&K.rageCd<=0&&dd<130&&K.lostT===0){K.rageT=2.5;K.rageCd=14*d.tp+4;sfxSawRev()}
      if(s.fire){K.fireT-=dt;if(K.fireT<=0){fires.push({x:K.x,y:K.y+3,t:6});K.fireT=2.2}}
      break}
    case 'FINISH':{
      const v=K.fv;
      if(!v||v.dead||v.escaped||!v.down||v.fin){K.st='PATROL';K.fv=null;break}
      gx=v.x;gy=v.y;spd=stalkSpd*1.25;
      if(Math.hypot(v.x-K.x,v.y-K.y)<13){
        const f=makeFin(K,v,KW[s.wpn].fin,v===P,s.wpn);
        K.fin=f;K.fv=null;K.st='SEARCH';K.searchT=2;
        if(v===P)cine=f;
        else if(Math.hypot(v.x-P.x,v.y-P.y)<200){msg('HE HAS '+v.name+'! STOP HIM!',2.5);sfxScream()}
        return;
      }
      break}
    case 'YANK':{
      const h=K.yank;
      if(!h){K.st='SEARCH';K.searchT=3;break}
      gx=h.ax;gy=h.ay;spd=chaseSpd;
      if(Math.hypot(gx-K.x,gy-K.y)<14){
        const o=h.occ;K.yank=null;
        if(o===P){unhideP();msg('HE TEARS THE DOOR OPEN!',2.5);sfxScream();
          P.hurtCd=0;hurtPlayer(P.x-K.x,P.y-K.y,null);K.tgt=P;K.st='CHASE';K.lostT=0;K.atkCd=0.8}
        else if(o){unhideH(o);sfxScream();say(o,'NO!');hurtHuman(o,1,K.x,K.y);K.tgt=o;K.st='CHASE';K.lostT=0;K.atkCd=0.8}
        else{K.st='SEARCH';K.searchT=3}
        sfxDoor();
      }
      break}
    case 'SEARCH':{
      K.searchT-=dt;spd=stalkSpd*0.9;
      if(!K.wp||Math.hypot(K.wp.x-K.x,K.wp.y-K.y)<8||K.stuckN>3){
        let w=null;
        for(let tr=0;tr<12&&!w;tr++){
          const nx=K.lkx+rr(-70,70),ny=K.lky+rr(-70,70);
          if(freeBox(nx,ny,4,6,false))w={x:nx,y:ny};
        }
        K.wp=w||{x:K.lkx,y:K.lky};K.stuckN=0;
      }
      gx=K.wp.x;gy=K.wp.y;
      if(K.searchT<=0){K.st='PATROL';K.pat=null}
      break}
    case 'INVESTIGATE':
      gx=K.ix;gy=K.iy;spd=stalkSpd*1.25;
      if(Math.hypot(gx-K.x,gy-K.y)<14){K.invT-=dt;spd=0;
        if(K.invT<=0){K.st='SEARCH';K.searchT=3;K.lkx=K.ix;K.lky=K.iy;K.wp=null}}
      break;
    case 'SAB':{
      const sb=K.sab;
      if(!sb){K.st='PATROL';break}
      gx=sb.x;gy=sb.y;spd=stalkSpd*1.1;
      if(Math.hypot(gx-K.x,gy-K.y)<14){
        if(sb.k==='car'){
          const inst=Object.keys(EX.car.parts).filter(k=>EX.car.parts[k]);
          if(inst.length){const it=pick(inst);EX.car.parts[it]=false;tossItem(car.cx,car.cy+24,it,T*9);
            msg('METAL SHRIEKS BY THE ROAD.',3);msg('SOMETHING WAS TORN OUT OF THE CAR.',3)}
          smoke(car.cx,car.y+4,12);
        }else if(sb.k==='gen'){EX.cops.power=false;msg('THE LIGHTS DIE.',3);smoke(gen.x,gen.y-6,12)}
        else if(sb.k==='boat'){EX.boat.key=false;tossItem(boat.ax,boat.ay,'BOAT KEY',T*8);
          msg('SOMETHING SPLASHES AT THE DOCK.',3)}
        sfxCrunch();sfxSting();K.sab=null;K.st='PATROL';K.pat=null;
      }
      break}
    default:{ // PATROL
      spd=stalkSpd;
      if(!K.pat||Math.hypot(K.pat.x-K.x,K.pat.y-K.y)<12||K.stuckN>4){
        K.stuckN=0;
        if(Math.random()<d.hunt+lv*0.04&&!P.hide){
          K.pat=spotNear(P.x,P.y,140);
        }else{
          const opts=conts.length?conts:buildings;
          const o=pick(opts);K.pat={x:o.ax||o.x0+8,y:o.ay||o.y1+8};
        }
      }
      gx=K.pat.x;gy=K.pat.y;
    }
  }
  if(spd>0){
    if(K.lungeT>0)spd*=2.6;
    if(K.rageT>0)spd*=1.5;
    if(s.water&&inWater(K.x,K.y))spd*=1.6;
    navTo(K,gx,gy,dt,spd,!!s.water,6);
    K.walkT+=dt*6;
  }else K.moving=false;
  unstick(K,4,6,!!s.water);
  K.tpT-=dt;
  if(K.tpT<=0){
    const pd=Math.hypot(P.x-K.x,P.y-K.y);
    if((K.st==='PATROL'||K.st==='SEARCH')&&pd>230&&!P.hide&&!P.down){
      if(killerTeleport()){K.st='SEARCH';K.lkx=P.x+rr(-60,60);K.lky=P.y+rr(-60,60);K.searchT=5;K.wp=null;
        msg(s.water?'THE WATER STIRS.':(s.fire?'YOU SMELL SMOKE.':(s.saw?'AN ENGINE COUGHS NEARBY.':'YOU HEAR BREATHING.')))}
    }
    K.tpT=(13+Math.random()*9)*d.tp*(enr?0.55:1)*(s.power==='VANISH'?0.7:1);
  }
  if(K.atkCd<=0){
    const pd=Math.hypot(P.x-K.x,P.y-K.y);
    if(pd<13&&!P.down&&!P.hide&&!P.fin&&P.hurtCd<=0){
      K.atkCd=d.atk;K.swingT=0.2;
      hurtPlayer(P.x-K.x,P.y-K.y,null,s.saw&&K.rageT>0?2:1);
    }else{
      for(const c of npcs){
        if(c.down||c.hide||c.dead||c.fin||c.hurtCd>0)continue;
        if(Math.hypot(c.x-K.x,c.y-K.y)<13){
          K.atkCd=d.atk;K.swingT=0.2;hurtHuman(c,1,K.x,K.y);
          if(c.down){K.st='FINISH';K.fv=c}
          break;
        }
      }
    }
  }
}
function hurtPlayer(ax,ay,cause,dmg){
  if(P.hurtCd>0||P.down||P.fin)return;
  P.hurtCd=0.6;P.hp-=(dmg||1);chan=null;
  blood(P.x,P.y-4,20);addStain(P.x,P.y+4,rr(4,7));
  const m=Math.hypot(ax,ay)||1;spurt(P.x,P.y,6,ax/m,6,40);
  shake=5;flashR=0.5;sfxHurt();
  if(cause)msg(cause);
  tryMove(P,ax/m*10,ay/m*10,4,5,false);unstick(P,4,5,false);
  if(P.hp<=0)playerZero();
}
function playerZero(){
  P.hp=0;chan=null;
  if(P.hide)unhideP();
  const allies=npcs.some(c=>!c.down&&!c.dead&&!c.escaped);
  const kd=Math.hypot(K.x-P.x,K.y-P.y);
  if(D().revive&&allies&&P.downs<3){
    P.down=true;P.downT=[30,20,12][P.downs];P.downs++;
    msg("YOU'RE DOWN. CRAWL. SOMEONE MIGHT COME.",3.5);sfxDown();
    blood(P.x,P.y,30,true);addStain(P.x,P.y,7);
    return;
  }
  if(K.st!=='DOWN'&&kd<40&&!K.fin){
    const f=makeFin(K,P,KW[S().wpn].fin,true,S().wpn);
    K.fin=f;cine=f;return;
  }
  blood(P.x,P.y,60,true);addStain(P.x,P.y,11);
  loseNight('KILLED');
}

/* ---------------- END OF NIGHT ---------------- */
function winNight(kind){
  if(state!==1)return;
  chan=null;
  const near=[];
  let ox=P.x,oy=P.y;
  if(kind==='CAR'){ox=car.cx;oy=car.cy}else if(kind==='BOAT'){ox=boat.ax;oy=boat.ay}
  else if(kind==='COPS'){ox=copSpot.x;oy=copSpot.y}
  if(kind!=='DAWN'){

function readMove(){
  let kdx=0,kdy=0;
  if(keys['arrowleft']||keys['a'])kdx-=1;
  if(keys['arrowright']||keys['d'])kdx+=1;
  if(keys['arrowup']||keys['w'])kdy-=1;
  if(keys['arrowdown']||keys['s'])kdy+=1;
  let dx=input.dx+kdx,dy=input.dy+kdy;
  const dm=Math.hypot(dx,dy);
  if(dm>1){dx/=dm;dy/=dm}
  const m=Math.min(1,dm);
  return{dx:dx,dy:dy,m:m,nx:dm>0?dx/Math.max(dm,0.0001):0,ny:dm>0?dy/Math.max(dm,0.0001):0};
}

  P.atkCd=Math.max(0,P.atkCd-dt);P.hurtCd=Math.max(0,P.hurtCd-dt);P.swingT=Math.max(0,P.swingT-dt);

  for(const c of cons.slice())humanUpdate(c,dt);

      else if(phone.tx&&!EX.cops.called&&EX.cops.cut<=0&&rectDist(P.x,P.y,phone.tx*T,phone.ty*T,T,T)<16)P.prompt='CUT LINE';
      else if(EX.gate.on&&EX.gate.open&&rectDist(P.x,P.y,gate.tx*T,2*T,32,T+8)<18)P.prompt='CHAIN GATE';
      else if(EX.hatch.on&&EX.hatch.open&&Math.hypot(P.x-hatch.x,P.y-hatch.y)<20)P.prompt='WEDGE HATCH';
      else if(EX.gate.on&&!EX.gate.open&&EX.gate.jam<=0&&rectDist(P.x,P.y,gate.tx*T,2*T,32,T)<18)P.prompt='JAM GATE';
      else if(EX.boat.on&&!EX.boat.gone&&EX.boat.dis<=0&&Math.hypot(P.x-boat.ax,P.y-boat.ay)<22)P.prompt='WRECK BOAT';

    for(let i=0;i<(o.cuts||0);i++)rc(x-3,y-4+ky+i*2,7,1,'#8a0a0a');
    if(o.open){rc(x-2,y-4+ky,5,6,'#6a0606');rc(x-1,y-3+ky,3,2,'#d86a7a');rc(x-1,y,3,1,'#a02030')}
    if(o.bisect)rc(x-4,y+1+ky,9,1,'#c01818');
    if(o.head!==false){
      if(o.crushed){

        rc(x-2,y-7+ky,1,1,'#e8e0d0');rc(x+2,y-6+ky,1,1,'#e8e0d0');
      }else{
        rc(x-3,y-11+ky,7,6,skin);rc(x-3,y-12+ky,7,2,f.hair);
        if(o.split){rc(x,y-12+ky,1,7,'#a01010');rc(x-3,y-12+ky,3,7,shade(skin,0.9))}
        else{rc(x-2,y-8+ky,1,1,'#111');rc(x+2,y-8+ky,1,1,'#111');rc(x,y-6+ky,1,1,'#3a0a0a')}
      }
    }else{rc(x-2,y-6+ky,5,1,'#8a0a0a');rc(x-1,y-7+ky,3,1,'#c02020')}
  }
}
function drawFin(f,cx,cy){
  const p=f.t/f.dur,vx=Math.round(f.vx-cx),vy=Math.round(f.vy-cy),d=f.dir;
  const kx=Math.round(f.kx-cx),ky=Math.round(f.ky-cy);
  const s=f.s,w=f.wpn,bl=p>f.hit;
  let pose='idle',vo={jit:p<f.hit};
  let fallen=false,fk=null;
  switch(f.kind){
    case 'DECAPITATE':
      pose=p<0.12?'idle':(p<f.hit?'raise':(p<f.hit+0.12?'swing':'low'));
      if(p>=f.hit)vo.head=false;
      if(p>=0.62){fallen=true;fk='headless'}
      if(p>=f.hit&&p<f.hit+0.06){ctx.fillStyle='rgba(255,255,255,0.8)';ctx.fillRect(vx-10,vy-7,20,1)}
      break;
    case 'FILLET':
      pose=(p>0.18&&p<0.56)?((p*12|0)%2?'swing':'thrust'):'low';
      vo.cuts=f.cuts;if(p>=0.64)vo.open=true;
      if(p>=0.82){fallen=true;fk='gutted'}
      break;
    case 'SKULL SPLIT':
      vo.kneel=p>0.08;
      pose=p<f.hit?'raise':(p<0.72?'swing':'low');
      if(p>=f.hit)vo.split=true;
      if(p>=0.78){fallen=true;fk='split'}
      if(p>=f.hit&&p<0.72){drawSlasher(kx,ky,s,{dir:d,pose:'swing',wpn:null});
        drawKW(vx,vy-9+3,w,0.15*d,true);victimParts(vx,vy,f,vo);return}
      break;
    case 'HEAD CRUSH':
      vo.kneel=p>0.08;
      pose=p<f.hit?'raise':'low';
      if(p>=f.hit)vo.crushed=true;
      if(p>=0.6){fallen=true;fk='crushed'}
      break;
    case 'IMPALE':
      pose=p<f.hit?'idle':(p<0.72?'lift':'swing');
      vo.lift=f.lift;
      if(f.tossed){drawSlasher(kx,ky,s,{dir:d,pose:'swing',wpn:w,bloody:true});return}
      if(p>=f.hit){vo.jit=true;
        drawSlasher(kx,ky,s,{dir:d,pose:'lift',wpn:w,bloody:true});
        victimParts(vx,vy,f,vo);
        rc(vx-1,vy-4-f.lift,1,1,'#2a0000');rc(vx+2,vy-3-f.lift,1,1,'#2a0000');
        return}
      break;
    case 'BISECT':
      pose=p<f.hit?'idle':'saw';
      if(p>f.hit)vo.bisect=true;
      vo.jit=p<0.62;
      if(p>=0.62){vo.torso=false;fallen=false}
      break;
  }
  if(fallen){drawCorpse({kind:fk,dir:d,shirt:f.shirt,hair:f.hair,pants:f.pants,skin:f.skin},vx,vy)}
  if(d>0){
    drawSlasher(kx,ky,s,{dir:d,pose:pose,wpn:w,bloody:bl});
    if(!fallen)victimParts(vx,vy,f,vo);
  }else{
    if(!fallen)victimParts(vx,vy,f,vo);
    drawSlasher(kx,ky,s,{dir:d,pose:pose,wpn:w,bloody:bl});
  }
}

function drawWorld(cx,cy){

  const tx1=Math.min(MW-1,tx0+Math.ceil(VW/T)+1),ty1=Math.min(MH-1,ty0+Math.ceil(VH/T)+1);
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)drawTile(tx,ty,tx*T-cx,ty*T-cy);
  // ground decals
  for(const s of stains){
    const sx=s.x-cx,sy=s.y-cy;

      if((NOW/400|0)%3===0)parts.push({k:'s',x:b.x0+w-16,y:b.y0-14+8,z:8,vx:rr(-3,3),vy:-4,vz:12,life:1.2})}

}

/* ---------------- DRAW: LIGHT ---------------- */
function ambient(){
  let a=mode===0?0.72:0.64;
  const p=nightProg();
  if(p>0.8)a*=1-(p-0.8)/0.2*0.65;
  if(lightFlash>0){const f=lightFlash;if(f>0.28||(f>0.12&&f<0.18))a*=0.08}
  return a;
}
function drawLighting(cx,cy){
  const L=[],fog=weather==='FOG'?0.85:1;
  const px=P.x-cx,py=P.y-cy-4;
  if(mode===0){
    const r=(P.hide?20:86)*(has('NIGHT EYES')?1.25:1)*fog;
    L.push({x:px,y:py,r:r,a:1});
  }else L.push({x:px,y:py,r:108*fog,a:1});
  for(const c of humans())if(c.lantern&&!c.hide&&!c.dead)L.push({x:c.x-cx,y:c.y-cy-4,r:34,a:0.9,c:'255,190,110'});
  if(EX.cops.power){
    for(const l of lamps){const x=l.x-cx,y=l.y-cy-6;
      if(x>-80&&y>-80&&x<VW+80&&y<VH+80)L.push({x:x,y:y,r:70+(Math.random()<0.03?-20:0),a:0.95,c:'255,200,120'})}
    for(const b of buildings){const x=(b.x0+b.x1)/2-cx,y=(b.y0+b.y1)/2-cy;
      if(x>-120&&y>-120&&x<VW+120&&y<VH+120)L.push({x:x,y:y,r:Math.max(b.w,b.h)*9,a:0.8,c:'255,190,110'})}
    if(gen.tx)L.push({x:gen.x-cx,y:gen.y-cy,r:20,a:0.6,c:'120,255,140'});

  for(const o of objs)if(o.kind==='CAMPFIRE'){const x=o.x-cx,y=o.y-cy-8;
    if(x>-90&&y>-90&&x<VW+90&&y<VH+90)L.push({x:x,y:y,r:62+Math.sin(NOW/90+o.v*9)*4,a:1,c:'255,140,50'})}
  for(const f of fires){const x=f.x-cx,y=f.y-cy;if(x>-40&&y>-40&&x<VW+40&&y<VH+40)L.push({x:x,y:y,r:28,a:0.9,c:'255,120,40'})}
  for(const s of shots)L.push({x:s.x-cx,y:s.y-cy,r:50,a:1,c:'255,80,60'});
  for(const f of flashes)L.push({x:f.x-cx,y:f.y-cy,r:80*f.t/0.3+20,a:1,c:'255,220,160'});
  if(EX.cops.here){const fl=(NOW/180|0)%2;L.push({x:copSpot.x-cx,y:copSpot.y-cy,r:95,a:0.9,c:fl?'255,40,40':'40,80,255'})}
  if(cine)L.push({x:cine.vx-cx,y:cine.vy-cy-6,r:110,a:1});
  if(K.fin&&K.fin!==cine)L.push({x:K.fin.vx-cx,y:K.fin.vy-cy-6,r:34,a:0.7,c:'200,40,40'});
  lctx.globalCompositeOperation='source-over';
  lctx.clearRect(0,0,VW,VH);
  lctx.fillStyle='rgba(3,4,16,'+ambient()+')';
  lctx.fillRect(0,0,VW,VH);
  lctx.globalCompositeOperation='destination-out';
  for(const l of L){
    const g=lctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r);
    g.addColorStop(0,'rgba(0,0,0,'+l.a+')');g.addColorStop(0.55,'rgba(0,0,0,'+(l.a*0.65)+')');
    g.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=g;lctx.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);
  }
  if(mode===0&&P.torch&&P.torchOn&&!P.hide&&!P.down&&!P.fin){
    const a=Math.atan2(P.fy,P.fx||0.0001),len=130*fog;
    lctx.save();lctx.beginPath();lctx.moveTo(px,py);
    lctx.lineTo(px+Math.cos(a-0.42)*len,py+Math.sin(a-0.42)*len);
    lctx.lineTo(px+Math.cos(a+0.42)*len,py+Math.sin(a+0.42)*len);
    lctx.closePath();lctx.clip();
    const g=lctx.createRadialGradient(px,py,4,px,py,len);
    g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(0.7,'rgba(0,0,0,0.7)');g.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=g;lctx.fillRect(px-len,py-len,len*2,len*2);
    lctx.restore();
  }
  lctx.globalCompositeOperation='source-over';
  ctx.drawImage(lc,0,0);
  ctx.globalCompositeOperation='lighter';
  for(const l of L){
    if(!l.c)continue;
    const g=ctx.createRadialGradient(l.x,l.y,0,l.x,l.y,l.r*0.8);
    g.addColorStop(0,'rgba('+l.c+',0.16)');g.addColorStop(1,'rgba('+l.c+',0)');
    ctx.fillStyle=g;ctx.fillRect(l.x-l.r,l.y-l.r,l.r*2,l.r*2);
  }
  if(mode===0&&P.torch&&P.torchOn&&!P.hide&&!P.down){
    const g=ctx.createRadialGradient(px,py,0,px,py,40);
    g.addColorStop(0,'rgba(255,230,170,0.08)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(px-40,py-40,80,80);
  }
  ctx.globalCompositeOperation='source-over';
}
function drawPostWorld(cx,cy){
  // eyes in the dark
  if(mode===0&&K.st!=='DOWN'&&!K.fin){
    const d=Math.hypot(K.x-P.x,K.y-P.y);
    if(d<170&&d>40){
      const x=(K.x-cx)|0,y=(K.y-cy)|0,s=S();
      ctx.globalAlpha=0.35+0.25*Math.sin(NOW/300);
      rc(x-2,y-12,2,1,s.glow);rc(x+2,y-12,2,1,s.glow);
      ctx.globalAlpha=1;
    }
  }
  // sense: see them all, even through walls
  if(mode===1&&senseT>0){
    const a=Math.min(1,senseT)*(0.5+0.3*Math.sin(NOW/120));
    ctx.globalAlpha=a;
    for(const c of cons){
      const x=(c.x-cx)|0,y=(c.y-cy)|0;
      if(x<-10||y<-20||x>VW+10||y>VH+10){
        const ang=Math.atan2(c.y-P.y,c.x-P.x);
        const ax=clamp(VW/2+Math.cos(ang)*(VW/2-12),8,VW-8),ay=clamp(VH/2+Math.sin(ang)*(VH/2-14),18,VH-10);
        rc(ax-1,ay-1,3,3,'#e02020');continue;
      }
      rc(x-3,y-12,7,6,'#e02020');rc(x-4,y-5,9,7,'#e02020');rc(x-3,y+2,7,4,'#e02020');
      if(c.inv.length)rc(x+5,y-15,3,3,IT[c.inv[0]].c);
    }
    ctx.globalAlpha=1;
  }
  // slasher alerts: someone is working on a way out
  if(mode===1)for(const a of alerts){
    const x=a.c.x-cx,y=a.c.y-cy,pulse=(NOW/150|0)%2;
    if(x>4&&y>14&&x<VW-4&&y<VH-4){
      ctx.strokeStyle=pulse?'#ff3030':'#801010';ctx.beginPath();ctx.arc(x,y-4,10+(NOW/60%6),0,7);ctx.stroke();
    }else{
      const ang=Math.atan2(a.c.y-P.y,a.c.x-P.x);
      const ax=clamp(VW/2+Math.cos(ang)*(VW/2-10),8,VW-8),ay=clamp(VH/2+Math.sin(ang)*(VH/2-12),20,VH-10);
      ctx.fillStyle=pulse?'#ff3030':'#a01010';ctx.beginPath();
      ctx.moveTo(ax+Math.cos(ang)*6,ay+Math.sin(ang)*6);
      ctx.lineTo(ax+Math.cos(ang+2.4)*5,ay+Math.sin(ang+2.4)*5);
      ctx.lineTo(ax+Math.cos(ang-2.4)*5,ay+Math.sin(ang-2.4)*5);ctx.fill();
    }
  }
  // rain
  if(weather==='RAIN'){
    while(rain.length<110)rain.push({x:Math.random()*VW,y:Math.random()*VH,s:rr(180,260)});
    ctx.fillStyle='rgba(150,170,210,0.35)';
    for(const r of rain){
      r.y+=r.s/60;r.x-=r.s/240;
      if(r.y>VH){r.y=-6;r.x=Math.random()*(VW+40)}
      ctx.fillRect(r.x|0,r.y|0,1,4);
      if(Math.random()<0.004)rc(r.x,r.y+4,2,1,'rgba(150,170,210,0.4)');
    }
  }
  // names, bubbles, bars
  for(const c of humans()){
    if(c.hide||c.dead||c.fin)continue;
    const x=(c.x-cx)|0,y=(c.y-cy)|0;
    if(x<-30||y<-30||x>VW+30||y>VH+30)continue;
    const d=Math.hypot(c.x-P.x,c.y-P.y);
    if(mode===0&&d<70&&!c.say)txtS(c.name,x-tw(c.name)/2,y-24,'#8a8a92');
    if(c.down){const t=Math.ceil(c.downT);txtS(t+'',x-tw(t+'')/2,y-14,'#e04040')}
    if(c.act){rc(x-10,y-20,20,4,'#111');rc(x-9,y-19,Math.min(18,c.act.t/c.act.dur*18),2,'#c8a848')}
    if(c.say&&d<220){
      const s=c.say.t,w=tw(s)+6,bx=clamp(x-w/2,2,VW-w-2),by=y-36;
      rc(bx,by,w,9,'rgba(232,224,208,0.9)');rc(x-1,by+9,3,2,'rgba(232,224,208,0.9)');
      txt(s,bx+3,by+2,'#1a1010');
    }
  }
  if(mode===0&&!P.hide){
    const x=(P.x-cx)|0,y=(P.y-cy)|0;
    if(chan){rc(x-11,y-22,22,5,'#111');rc(x-10,y-21,Math.min(20,chan.t/chan.dur*20),3,'#c8a848');
      txtS(chan.label,x-tw(chan.label)/2,y-30,'#e8e0d0')}
    else if(P.prompt&&!P.down)txtS('A:'+P.prompt,x-tw('A:'+P.prompt)/2,y-26,'#e8e0d0');
  }
  if(mode===1&&P.prompt&&!cine){const x=(P.x-cx)|0,y=(P.y-cy)|0;
    txtS('A:'+P.prompt,x-tw('A:'+P.prompt)/2,y-28,'#e86060')}
}

function refreshMinimap(){
  if(mmC.width!==MW||mmC.height!==MH){mmC.width=MW;mmC.height=MH}
  const x=mmC.getContext('2d'),id=x.createImageData(MW,MH);
  for(let i=0;i<MW*MH;i++){

  }

  let lx=(VW-lg.reduce((a,l)=>a+tw(l[0])+12,0))/2|0;const ly=Math.min(VH-8,oy+h+4);

function exitTracker(x,y){
  const rows=[];
  const box=(bx,by,on,carry,col)=>{
    mctx.fillStyle=on?col:'#2a2a30';mctx.fillRect(bx,by,5,5);
    if(!on&&carry&&(NOW/250|0)%2){mctx.fillStyle=col;mctx.fillRect(bx,by,5,1);mctx.fillRect(bx,by+4,5,1);mctx.fillRect(bx,by,1,5);mctx.fillRect(bx+4,by,1,5)}
  };
  const carries=it=>mode===0&&P.q.includes(it);
  let yy=y;
  const label=(t,ok,dead)=>txt(t,x,yy,dead?'#3a3a42':(ok?'#3ae04a':'#8a8a92'));
  if(EX.car.on){
    label('CAR',carReady(),EX.car.gone);
    if(EX.car.gone)txt('GONE',x+22,yy,'#5a3a3a');
    else ['CAR KEYS','BATTERY','GAS CAN'].forEach((it,i)=>box(x+22+i*7,yy,EX.car.parts[it],carries(it),IT[it].c));
    yy+=8;
  }
  label('COPS',EX.cops.here);
  if(EX.cops.here)txt('HERE',x+22,yy,'#3ae04a');
  else if(EX.cops.called)txt((EX.cops.t|0)+'S',x+22,yy,(NOW/400|0)%2?'#e04040':'#c9c9c0');
  else{box(x+22,yy,EX.cops.fuse,carries('FUSE'),IT['FUSE'].c);box(x+29,yy,EX.cops.power,false,'#ffe08a');
    box(x+36,yy,false,false,'#4a8ae0');if(EX.cops.cut>0)txt('CUT',x+44,yy,'#a04040')}
  yy+=8;
  if(EX.gate.on){label('GATE',EX.gate.open);
    if(EX.gate.open)txt('OPEN',x+22,yy,'#3ae04a');else box(x+22,yy,false,carries('GATE KEY'),IT['GATE KEY'].c);
    if(EX.gate.jam>0)txt('JAM',x+30,yy,'#a04040');yy+=8}
  if(EX.boat.on){label('BOAT',boatReady(),EX.boat.gone);
    if(EX.boat.gone)txt('GONE',x+22,yy,'#5a3a3a');else box(x+22,yy,EX.boat.key,carries('BOAT KEY'),IT['BOAT KEY'].c);yy+=8}
  if(EX.hatch.on){label('HATCH',EX.hatch.open);
    if(!EX.hatch.found&&mode===0)txt('?',x+24,yy,'#5a5a62');
    else if(EX.hatch.open)txt('OPEN',x+24,yy,'#3ae04a');else box(x+24,yy,false,carries('HATCH KEY'),IT['HATCH KEY'].c);yy+=8}
  return yy;
}
function drawHUD(){

    for(let i=0;i<P.maxhp;i++){

      mctx.fillRect(hx,hy+2,5,2);mctx.fillRect(hx+1,hy+4,3,1);mctx.fillRect(hx+2,hy+5,1,1);
    }

    mctx.fillStyle='rgba(0,0,0,0.4)';mctx.fillRect(0,14,62,EX.gate.on+EX.boat.on+EX.hatch.on>=2?44:36);
    exitTracker(3,16);

  // minimap
  mmT-=1/60;if(mmT<=0){mmT=0.5;refreshMinimap()}
  const sc=Math.min(64/MW,48/MH),mw=MW*sc|0,mh=MH*sc|0;
  mmRect={x:VW-mw-4,y:28,w:mw,h:mh};
  mctx.globalAlpha=0.85;mctx.drawImage(mmC,mmRect.x,mmRect.y,mw,mh);mctx.globalAlpha=1;
  mctx.strokeStyle='#3a3a42';mctx.strokeRect(mmRect.x-0.5,mmRect.y-0.5,mw+1,mh+1);

  // messages

function drawControls(){

  mctx.fillStyle='#7a1414';mctx.beginPath();mctx.arc(BTN_A.x,BTN_A.y,BTN_A.r,0,7);mctx.fill();
  const ring=(b,cd,max,col)=>{
    if(cd>0){mctx.fillStyle='#222';mctx.beginPath();mctx.arc(b.x,b.y,b.r,0,7);mctx.fill();
      mctx.fillStyle=col;mctx.beginPath();mctx.moveTo(b.x,b.y);
      mctx.arc(b.x,b.y,b.r,-Math.PI/2,-Math.PI/2+(1-cd/max)*Math.PI*2);mctx.fill()}
    else{mctx.fillStyle=col;mctx.beginPath();mctx.arc(b.x,b.y,b.r,0,7);mctx.fill()}
  };
  if(mode===1){
    ring(BTN_B,powerCd,S().pcd*(has('RELENTLESS')?0.65:1),'#5a2a5a');
    ring(BTN_C,senseCd,has('BLOODHOUND')?10:20,'#2a4a5a');

  txt('A',BTN_A.x-1,BTN_A.y-2,'#fff');
  txt(mode===1?'PWR':'RUN',BTN_B.x-5,BTN_B.y-2,'#fff');
  txt(mode===1?'SNS':'USE',BTN_C.x-5,BTN_C.y-2,'#fff');

}

  ctx.fillStyle='#a8a89a';ctx.beginPath();ctx.arc(mx-4,33,3,0,7);ctx.fill();ctx.beginPath();ctx.arc(mx+4,40,2,0,7);ctx.fill();

    const sl=SLASHERS[(NOW/6000|0)%4];

  }

  const ox=-((NOW*0.01)%256);for(let y=-MOY;y<VH;y+=256)for(let x=ox;x<VW;x+=256)ctx.drawImage(fogC,x|0,y);

const deathLines=['THE LAKE KEEPS ITS SECRETS.','NO ONE HEARD YOU SCREAM.',
 'HE ALWAYS FINISHES HIS ROUNDS.','THE WOODS ARE QUIET AGAIN.','THE CABINS WILL BE CLEANED BY SUMMER.'];

  txtC('IT GETS WORSE.',184,'#5a5a62');

/* ---------------- LOOP ---------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;
  if(dt>0.1)dt=0.1;
  NOW=now;
  stateT+=dt;
  try{
    if(state===1){
      if(cine){
        const f=cine,slow=(Math.abs(f.t/f.dur-f.hit)<0.06)?0.35:1;
        updateFin(f,dt*slow);tickFx(dt*slow);
      }else{
        elapsed+=dt;
        if(mode===0)updateSurvive(dt);else updateSlasher(dt);
        if(state===1){tickFx(dt);audioTick(dt)}
      }
    }else{setSaw(0);setRain(0)}
    ctx=mctx;mctx.imageSmoothingEnabled=false;
    const menu=state!==1&&state!==10&&!(state===2&&stateT<1);
    if(menu&&MOY){mctx.fillStyle='#050508';mctx.fillRect(0,0,VW,VH);mctx.save();mctx.translate(0,MOY)}
    if(state===0)drawTitle();
    else if(state===4)drawModeMenu();
    else if(state===5)drawDiffMenu();
    else if(state===6)drawSlasherMenu();
    else if(state===8)drawWeaponMenu();
    else if(state===7)drawNightCard();
    else if(state===1)drawGame();
    else if(state===2)drawLose();
    else if(state===9)drawPerkMenu();
    else if(state===10)drawPause();
    else drawWin();
    if(menu&&MOY)mctx.restore();
  }catch(e){console.error(e);window.__err=e;try{mctx.restore()}catch(_){}}
  requestAnimationFrame(loop);
}
addEventListener('resize',fit);
fit();
requestAnimationFrame(loop);
