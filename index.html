function fit(){
  const ar=innerWidth/Math.max(1,innerHeight);
  if(ar<1){VW=256;VH=Math.max(224,Math.min(456,Math.round(256/ar/2)*2))}
  else{VH=224;VW=Math.max(256,Math.min(480,Math.round(VH*ar/2)*2))}
  MOY=(VH-224)>>1;
  for(const c of [cv,buf,lc]){c.width=VW;c.height=VH}
  const s=Math.min(innerWidth/VW,innerHeight/VH);
  cv.style.width=(VW*s)+'px';cv.style.height=(VH*s)+'px';
  vign=document.createElement('canvas');vign.width=VW;vign.height=VH;
  const v=vign.getContext('2d'),g=v.createRadialGradient(VW/2,VH/2,VH*0.3,VW/2,VH/2,VW*0.62);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.62)');
  v.fillStyle=g;v.fillRect(0,0,VW,VH);
  layoutButtons();
}

/* ---------------- UTIL ---------------- */
function rr(a,b){return a+Math.random()*(b-a)}
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1))}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function dst(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function shuffle(a){for(let i=a.length-1;i>0;i--){
  const j=Math.random()*(i+1)|0;const t=a[i];a[i]=a[j];a[j]=t}return a}

const F={A:[7,5,7,5,5],B:[6,5,6,5,6],C:[7,4,4,4,7],D:[6,5,5,5,6],E:[7,4,6,4,7],

'4':[5,5,7,1,1],'5':[7,4,7,1,7],'6':[7,4,7,5,7],'7':[7,1,2,2,2],'8':[7,5,7,5,7],
'9':[7,5,7,1,7],':':[0,2,0,2,0],'.':[0,0,0,0,2],',':[0,0,0,2,4],'!':[2,2,2,0,2],
'-':[0,0,7,0,0],"'":[2,4,0,0,0],'?':[7,1,2,0,2],'/':[1,1,2,4,4],'+':[0,2,7,2,0],
'>':[4,2,1,2,4],'<':[1,2,4,2,1],'%':[5,1,2,4,5],'(':[1,2,2,2,1],')':[4,2,2,2,4],
'=':[0,7,0,7,0],'*':[5,2,7,2,5],'#':[5,7,5,7,5],'[':[3,2,2,2,3],']':[6,2,2,2,6]};
function txt(s,x,y,c,sc){sc=sc||1;ctx.fillStyle=c;s=(''+s).toUpperCase();let px=x|0;y=y|0;
  for(const ch of s){
    if(ch===' '){px+=4*sc;continue}
    const g=F[ch];if(!g){px+=4*sc;continue}
    for(let r=0;r<5;r++){const b=g[r];
      for(let k=0;k<3;k++){if(b&(4>>k))ctx.fillRect(px+k*sc,y+r*sc,sc,sc)}}
    px+=4*sc}}
function tw(s,sc){sc=sc||1;return (''+s).length*4*sc-sc}
function txtC(s,y,c,sc){txt(s,((VW-tw(s,sc))/2)|0,y,c,sc)}
function txtS(s,x,y,c,sc){txt(s,x+1,y+1,'#000',sc);txt(s,x,y,c,sc)}
function txtCS(s,y,c,sc){const x=((VW-tw(s,sc))/2)|0;txt(s,x+1,y+1,'#000',sc);txt(s,x,y,c,sc)}

/* ---------------- AUDIO ---------------- */
let AC=null,noiseBuf=null,master=null,droneOn=false,rainG=null,sawG=null,sawO=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=0.9;
    const comp=AC.createDynamicsCompressor();
    master.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null}
}
function beep(f,dur,type,vol,slide,delay){
  if(!AC)return;try{
  const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t0+dur);
  g.gain.setValueAtTime(vol||0.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.02);}catch(e){}
}
function noiseF(vol,dur,freq,ftype,delay){
  if(!AC||!noiseBuf)return;try{
  const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=ftype||'lowpass';f.frequency.value=freq||6000;
  g.gain.setValueAtTime(vol||0.2,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+(dur||0.15));
  s.connect(f);f.connect(g);g.connect(master);
  s.start(t0,Math.random()*1.5);s.stop(t0+(dur||0.15)+0.05);}catch(e){}
}
function noiseHit(vol,dur){noiseF(vol,dur,9000,'lowpass')}
function startDrone(){
  if(!AC||droneOn)return;droneOn=true;try{
  const g=AC.createGain();g.gain.value=0.03;g.connect(master);
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=49;
  const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=49.6;
  o1.connect(g);o2.connect(g);o1.start();o2.start();
  // rain bed (silent until it rains)
  const rs=AC.createBufferSource();rs.buffer=noiseBuf;rs.loop=true;
  const rf=AC.createBiquadFilter();rf.type='highpass';rf.frequency.value=1800;
  rainG=AC.createGain();rainG.gain.value=0;
  rs.connect(rf);rf.connect(rainG);rainG.connect(master);rs.start();
  // chainsaw idle (silent until the Butcher is near)
  sawO=AC.createOscillator();sawO.type='sawtooth';sawO.frequency.value=58;
  const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=13;lg.gain.value=9;
  lfo.connect(lg);lg.connect(sawO.frequency);
  sawG=AC.createGain();sawG.gain.value=0;
  sawO.connect(sawG);sawG.connect(master);sawO.start();lfo.start();
  }catch(e){}
}
function setRain(v){if(rainG)try{rainG.gain.setTargetAtTime(v,AC.currentTime,0.4)}catch(e){}}
function setSaw(v){if(sawG)try{sawG.gain.setTargetAtTime(v,AC.currentTime,0.1)}catch(e){}}
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended')AC.resume();startDrone()}

const TSUF=['LOOP','LAKE','HOLLOW','RIDGE','TRAIL','MEADOW','CREEK','POINT','BEND','PINES'];

/* ---------------- WORLD ---------------- */
const T=16,MAXW=128,MAXH=96,NM=MAXW*MAXH;
let MW=82,MH=62,WPX=MW*T,HPX=MH*T;
const tiles=new Uint8Array(NM),SOLID=new Uint8Array(NM),VAR=new Uint8Array(NM),
  RES=new Uint8Array(NM),explored=new Uint8Array(NM),reach=new Uint8Array(NM),bloodG=new Uint8Array(NM);
// ground: grass tree water wall door path dock floor road fence gate bush rock sand window
const GR=0,TR=1,WA=2,WL=3,DR=4,PA=5,DK=6,FL=7,RD=8,FE=9,GT=10,BU=11,RK=12,SA=13,WN=14;
const DX8=[1,-1,0,0,1,1,-1,-1],DY8=[0,0,1,-1,1,-1,1,-1];
let buildings=[],conts=[],objs=[],lamps=[],fires=[],traps=[],shots=[],pickups=[],noises=[],crackers=[];
let corpses=[],gibs=[],stains=[],decals=[],parts=[],msgs=[];
let car={},gen={},phone={},gate={},boat={},hatch={},copSpot={},spawn={x:0,y:0};
let EX={};

function inb(x,y){return x>=0&&y>=0&&x<MW&&y<MH}
function tset(x,y,t,s){if(!inb(x,y))return;const i=y*MW+x;tiles[i]=t;SOLID[i]=s?1:0}
function tget(x,y){return inb(x,y)?tiles[y*MW+x]:TR}
function sget(x,y){return inb(x,y)?SOLID[y*MW+x]:1}
function solidAt(px,py,wOK){
  const x=Math.floor(px/T),y=Math.floor(py/T);
  if(!inb(x,y))return true;
  const i=y*MW+x;
  if(wOK&&tiles[i]===WA)return false;
  return !!SOLID[i];
}
function freeBox(x,y,hw,hh,wOK){
  return !solidAt(x-hw,y-hh,wOK)&&!solidAt(x+hw,y-hh,wOK)&&
         !solidAt(x-hw,y+hh,wOK)&&!solidAt(x+hw,y+hh,wOK);
}
function buildingAt(x,y){
  for(const b of buildings)if(x>=b.x0&&x<b.x1&&y>=b.y0&&y<b.y1)return b;
  return null;
}
function inWater(x,y){return tget(Math.floor(x/T),Math.floor(y/T))===WA}

/* ---------------- PATHFINDING (A*) ---------------- */
const pfG=new Float32Array(NM),pfFrom=new Int32Array(NM),pfSeen=new Uint32Array(NM),pfDone=new Uint32Array(NM);
let pfGen=0;
const HM=1<<16,hI=new Int32Array(HM),hFv=new Float32Array(HM);let hN=0;
function hPush(i,f){if(hN>=HM)return false;let k=hN++;
  while(k>0){const p=(k-1)>>1;if(hFv[p]<=f)break;hI[k]=hI[p];hFv[k]=hFv[p];k=p}
  hI[k]=i;hFv[k]=f;return true}
function hPop(){const top=hI[0];hN--;
  if(hN>0){const li=hI[hN],lf=hFv[hN];let k=0;
    for(;;){let c=2*k+1;if(c>=hN)break;if(c+1<hN&&hFv[c+1]<hFv[c])c++;
      if(hFv[c]>=lf)break;hI[k]=hI[c];hFv[k]=hFv[c];k=c}
    hI[k]=li;hFv[k]=lf}
  return top}
// m: 0 walk, 1 walk+swim, 2 carve paths (gen), 3 clear trees (gen)
function tcost(i,m){
  const t=tiles[i],s=SOLID[i];
  if(m===0)return s?-1:1;
  if(m===1)return (s&&t!==WA)?-1:(t===WA?1.2:1);
  if(m===2)return s?-1:(t===PA||t===RD?0.3:(t===SA?1.6:1));
  if(t===TR||t===RK)return 5;
  return s?-1:1;
}
function astar(sx,sy,gx,gy,m,maxIt){
  if(!inb(sx,sy)||!inb(gx,gy))return null;
  if(tcost(gy*MW+gx,m)<0){
    let f=false;
    for(let r=1;r<=2&&!f;r++)for(let dy=-r;dy<=r&&!f;dy++)for(let dx=-r;dx<=r&&!f;dx++){
      const x=gx+dx,y=gy+dy;
      if(inb(x,y)&&tcost(y*MW+x,m)>=0){gx=x;gy=y;f=true}}
    if(!f)return null;
  }
  pfGen++;hN=0;
  const s=sy*MW+sx,g=gy*MW+gx,hs=m===2?0.3:1;
  if(s===g)return [];
  pfG[s]=0;pfFrom[s]=-1;pfSeen[s]=pfGen;hPush(s,0);
  let it=0;maxIt=maxIt||14000;
  while(hN>0&&it++<maxIt){
    const cur=hPop();
    if(pfDone[cur]===pfGen)continue;
    pfDone[cur]=pfGen;
    if(cur===g){
      const path=[];let c=g;
      while(c!==s&&c>=0){path.push(c);c=pfFrom[c]}
      path.reverse();return path;
    }
    const cx=cur%MW,cy=(cur/MW)|0,cg=pfG[cur];
    for(let k=0;k<8;k++){
      const dx=DX8[k],dy=DY8[k],nx=cx+dx,ny=cy+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=ny*MW+nx;if(pfDone[ni]===pfGen)continue;
      const c=tcost(ni,m);if(c<0)continue;
      let step=c;
      if(dx&&dy){
        if(tcost(cy*MW+nx,m)<0||tcost(ny*MW+cx,m)<0)continue;
        step*=1.414;
      }
      const ng=cg+step;
      if(pfSeen[ni]!==pfGen||ng<pfG[ni]){
        pfSeen[ni]=pfGen;pfG[ni]=ng;pfFrom[ni]=cur;
        const hx=Math.abs(nx-gx),hy=Math.abs(ny-gy);
        if(!hPush(ni,ng+((hx+hy)-0.586*Math.min(hx,hy))*hs))return null;
      }
    }
  }
  return null;
}
const fq=new Int32Array(NM);
function flood(sx,sy){
  reach.fill(0);
  if(!inb(sx,sy))return;
  let h=0,t=0;fq[t++]=sy*MW+sx;reach[sy*MW+sx]=1;
  while(h<t){
    const c=fq[h++],x=c%MW,y=(c/MW)|0;
    for(let k=0;k<4;k++){
      const nx=x+DX8[k],ny=y+DY8[k];
      if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=ny*MW+nx;
      if(reach[ni]||SOLID[ni])continue;
      reach[ni]=1;fq[t++]=ni;
    }
  }
}

/* ---------------- MOVEMENT ---------------- */
function tryMove(e,dx,dy,hw,hh,wOK){
  if(dx){
    const nx=e.x+dx;
    if(freeBox(nx,e.y,hw,hh,wOK))e.x=nx;
    else if(freeBox(nx,e.y-3,hw,hh,wOK))e.y-=1.4;
    else if(freeBox(nx,e.y+3,hw,hh,wOK))e.y+=1.4;
  }
  if(dy){
    const ny=e.y+dy;
    if(freeBox(e.x,ny,hw,hh,wOK))e.y=ny;
    else if(freeBox(e.x-3,ny,hw,hh,wOK))e.x-=1.4;
    else if(freeBox(e.x+3,ny,hw,hh,wOK))e.x+=1.4;
  }
}
function unstick(e,hw,hh,wOK){
  if(freeBox(e.x,e.y,hw,hh,wOK))return;
  for(let r=1;r<=12;r++){
    for(let a=0;a<16;a++){
      const ang=a/16*Math.PI*2;
      const nx=e.x+Math.cos(ang)*r*3,ny=e.y+Math.sin(ang)*r*3;
      if(nx>T&&ny>T&&nx<WPX-T&&ny<HPX-T&&freeBox(nx,ny,hw,hh,wOK)&&
        (r<=2||!solidAt((e.x+nx)/2,(e.y+ny)/2,wOK))){e.x=nx;e.y=ny;return}
    }
  }
}
function walkLOS(x0,y0,x1,y1,wOK){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/5);
  for(let i=1;i<=n;i++){const t=i/n;
    if(!freeBox(x0+(x1-x0)*t,y0+(y1-y0)*t,4,5,wOK))return false}
  return true;
}
// sight: walls block, two or more trees block
function sightLOS(x0,y0,x1,y1){
  const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/7);let trees=0,last=-1;
  for(let i=1;i<n;i++){const t=i/n;
    const tx=Math.floor((x0+(x1-x0)*t)/T),ty=Math.floor((y0+(y1-y0)*t)/T);
    const ti=ty*MW+tx;if(ti===last)continue;last=ti;
    const g=tget(tx,ty);
    if(g===WL||g===WN||g===RK)return false;
    if(g===TR&&++trees>=2)return false;
  }
  return true;
}
function navTo(e,tx,ty,dt,spd,wOK,hh){
  hh=hh||5;
  const d=Math.hypot(tx-e.x,ty-e.y);
  if(d<4){e.moving=false;return true}
  e.navT=(e.navT||0)-dt;
  if(e.navT<=0||!e.pT||Math.hypot(e.pT.x-tx,e.pT.y-ty)>24){
    e.navT=0.45+Math.random()*0.35;e.pT={x:tx,y:ty};
    if(d<240&&walkLOS(e.x,e.y,tx,ty,wOK))e.path=null;
    else{
      const p=astar(Math.floor(e.x/T),Math.floor(e.y/T),Math.floor(tx/T),Math.floor(ty/T),wOK?1:0);
      e.path=p;e.pi=0;
      if(!p)e.navT=0.8+Math.random()*0.6;
    }
  }
  let gx=tx,gy=ty;
  if(e.path&&e.pi<e.path.length){
    let guard=0;
    while(e.pi+1<e.path.length&&guard++<3){
      const n=e.path[e.pi+1],nx=(n%MW)*T+8,ny=((n/MW)|0)*T+8;
      if(Math.hypot(nx-e.x,ny-e.y)<64&&walkLOS(e.x,e.y,nx,ny,wOK))e.pi++;else break;
    }
    const n=e.path[e.pi];gx=(n%MW)*T+8;gy=((n/MW)|0)*T+8;
    if(Math.hypot(gx-e.x,gy-e.y)<5)e.pi++;
    if(e.pi>=e.path.length){e.path=null;gx=tx;gy=ty}
  }
  const mx=gx-e.x,my=gy-e.y,md=Math.hypot(mx,my)||1;
  const st=Math.min(spd*dt,md);
  tryMove(e,mx/md*st,my/md*st,4,hh,wOK);
  e.moving=true;e.fx=mx/md;e.fy=my/md;
  e.stT=(e.stT||0)+dt;
  if(e.stT>0.8){
    if(Math.hypot(e.x-(e.slx||0),e.y-(e.sly||0))<3){
      e.navT=0;e.path=null;
      tryMove(e,(Math.random()-0.5)*8,(Math.random()-0.5)*8,4,hh,wOK);
      e.stuckN=(e.stuckN||0)+1;
    }else e.stuckN=0;
    e.slx=e.x;e.sly=e.y;e.stT=0;
  }
  return false;
}

/* ---------------- MAP GENERATION ---------------- */
function noiseGrid(scale){
  const gw=Math.ceil(MW/scale)+2,gh=Math.ceil(MH/scale)+2,g=new Float32Array(gw*gh);
  for(let i=0;i<g.length;i++)g[i]=Math.random();
  return function(x,y){
    const fx=x/scale,fy=y/scale,ix=fx|0,iy=fy|0,tx=fx-ix,ty=fy-iy;
    const sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);
    const a=g[iy*gw+ix],b=g[iy*gw+ix+1],c=g[(iy+1)*gw+ix],d=g[(iy+1)*gw+ix+1];
    return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy;
  };
}
function canPlace(tx,ty,w,h,m){
  for(let y=ty-m;y<ty+h+m;y++)for(let x=tx-m;x<tx+w+m;x++){
    if(x<3||y<3||x>=MW-3||y>=MH-5)return false;
    const i=y*MW+x;if(RES[i]||tiles[i]!==GR||SOLID[i])return false;
  }
  return true;
}
function reserve(tx,ty,w,h,m){
  for(let y=ty-m;y<ty+h+m;y++)for(let x=tx-m;x<tx+w+m;x++)if(inb(x,y))RES[y*MW+x]=1;
}
function addCont(type,tx,ty,w,h,b){
  const c={type:type,tx:tx,ty:ty,w:w||1,h:h||1,x:(tx+(w||1)/2)*T,y:(ty+(h||1)/2)*T,
    items:[],searched:false,claim:null,b:b||null,hide:!!CT[type].hide,occ:null,ax:0,ay:0};
  conts.push(c);return c;
}
function makeBuilding(tx,ty,w,h,kind,nd){
  const b={tx:tx,ty:ty,w:w,h:h,kind:kind,x0:tx*T,y0:ty*T,x1:(tx+w)*T,y1:(ty+h)*T,roofA:1,doors:[],
    roof:kind==='LODGE'?'#2e3a2a':(kind==='SHED'?'#3a3a42':pick(['#4a2420','#3e2a1c','#2c2a36','#3a1c1c']))};
  for(let y=ty;y<ty+h;y++)for(let x=tx;x<tx+w;x++){
    const edge=(x===tx||x===tx+w-1||y===ty||y===ty+h-1);
    tset(x,y,edge?WL:FL,edge);
  }
  for(let x=tx+1;x<tx+w-1;x++)if(Math.random()<0.3)tset(x,ty,WN,1);
  for(let y=ty+1;y<ty+h-1;y++){
    if(Math.random()<0.25)tset(tx,y,WN,1);
    if(Math.random()<0.25)tset(tx+w-1,y,WN,1);
  }
  for(let x=tx+1;x<tx+w-1;x++)if(Math.random()<0.35)tset(x,ty+h-1,WN,1);
  const dxs=nd===2?[tx+2,tx+w-3]:[tx+(w>>1)];
  reserve(tx,ty,w,h,1);
  for(const dx of dxs){
    tset(dx,ty+h-1,DR,0);
    b.doors.push({tx:dx,ty:ty+h-1});
    reserve(dx-1,ty+h,3,2,0);
  }
  buildings.push(b);
  return b;
}
function interiorOK(b){
  // every floor tile reachable from a door, every solid furnishing touches reachable floor
  const seen=new Set(),q=[];
  for(const d of b.doors){const i=(d.ty-1)*MW+d.tx;if(!SOLID[i]){seen.add(i);q.push(i)}}
  while(q.length){const c=q.pop(),x=c%MW,y=(c/MW)|0;
    for(let k=0;k<4;k++){const nx=x+DX8[k],ny=y+DY8[k];
      if(nx<=b.tx||ny<=b.ty||nx>=b.tx+b.w-1||ny>=b.ty+b.h-1)continue;
      const ni=ny*MW+nx;if(SOLID[ni]||seen.has(ni))continue;seen.add(ni);q.push(ni)}}
  for(let y=b.ty+1;y<b.ty+b.h-1;y++)for(let x=b.tx+1;x<b.tx+b.w-1;x++){
    const i=y*MW+x;
    if(!SOLID[i]){if(!seen.has(i))return false;continue}
    let ok=false;
    for(let k=0;k<4;k++)if(seen.has((y+DY8[k])*MW+x+DX8[k]))ok=true;
    if(!ok)return false;
  }
  return true;
}
function furnish(b,types){
  const spots=[];
  for(let x=b.tx+1;x<b.tx+b.w-1;x++)spots.push([x,b.ty+1]);
  for(let y=b.ty+2;y<b.ty+b.h-2;y++){spots.push([b.tx+1,y]);spots.push([b.tx+b.w-2,y])}
  shuffle(spots);
  let n=0;
  for(const s of spots){
    if(n>=types.length)break;
    const x=s[0],y=s[1],i=y*MW+x;
    if(SOLID[i])continue;
    if(b.doors.some(d=>Math.abs(d.tx-x)+Math.abs(d.ty-1-y)<=1))continue;
    SOLID[i]=1;
    if(!interiorOK(b)){SOLID[i]=0;continue}
    addCont(types[n],x,y,1,1,b);n++;
  }
}
function placeProp(kind,w,h,ctype){
  for(let tr=0;tr<220;tr++){
    const tx=ri(3,MW-4-w),ty=ri(3,MH-7-h);
    if(!canPlace(tx,ty,w,h,1))continue;
    for(let y=ty;y<ty+h;y++)for(let x=tx;x<tx+w;x++)SOLID[y*MW+x]=1;
    reserve(tx,ty,w,h,1);
    const o={kind:kind,tx:tx,ty:ty,w:w,h:h,x:(tx+w/2)*T,y:(ty+h)*T,v:Math.random()};
    objs.push(o);
    if(ctype)o.cont=addCont(ctype,tx,ty,w,h,null);
    return o;
  }
  return null;
}
function placeNear(b,kind,ctype){
  // a crate or barrel tucked against a building
  for(let tr=0;tr<30;tr++){
    const side=ri(0,3);let x,y;
    if(side===0){x=ri(b.tx,b.tx+b.w-1);y=b.ty-1}
    else if(side===1){x=b.tx-1;y=ri(b.ty,b.ty+b.h-2)}
    else{x=b.tx+b.w;y=ri(b.ty,b.ty+b.h-2)}
    if(!inb(x,y)||tiles[y*MW+x]!==GR||SOLID[y*MW+x])continue;
    if(x<3||y<3||x>=MW-3)continue;
    SOLID[y*MW+x]=1;
    const o={kind:kind,tx:x,ty:y,w:1,h:1,x:x*T+8,y:(y+1)*T,v:Math.random()};
    objs.push(o);o.cont=addCont(ctype,x,y,1,1,null);
    return o;
  }
  return null;
}
function freeAdj(tx,ty,w,h,needReach){
  const c=[];
  for(let x=tx;x<tx+w;x++)c.push([x,ty+h]);
  for(let y=ty;y<ty+h;y++){c.push([tx-1,y]);c.push([tx+w,y])}
  for(let x=tx;x<tx+w;x++)c.push([x,ty-1]);
  for(const p of c){
    if(!inb(p[0],p[1]))continue;
    const i=p[1]*MW+p[0];
    if(SOLID[i])continue;
    if(needReach&&!reach[i])continue;
    return p;
  }
  return null;
}
// walk a path, also touching one orthogonal tile at every diagonal step,
// so the result is connected edge-to-edge and nobody squeezes through corners
function walk4(start,p,fn){
  let prev=start;
  for(const i of p){
    const px=prev%MW,py=(prev/MW)|0,cx=i%MW,cy=(i/MW)|0;
    if(px!==cx&&py!==cy){
      const a=py*MW+cx,b=cy*MW+px;
      fn(tcost(a,0)>=0||tiles[a]===TR||tiles[a]===RK?a:b);
    }
    fn(i);prev=i;
  }
}
function clearTo(tx,ty){
  const sx=Math.floor(spawn.x/T),sy=Math.floor(spawn.y/T);
  const p=astar(sx,sy,tx,ty,3,30000);
  if(!p)return false;
  walk4(sy*MW+sx,p,i=>{if(tiles[i]===TR||tiles[i]===RK){tiles[i]=GR;SOLID[i]=0}});
  if(tiles[ty*MW+tx]===TR||tiles[ty*MW+tx]===RK){tiles[ty*MW+tx]=GR;SOLID[ty*MW+tx]=0}
  return true;
}
function ensureReach(tx,ty,w,h){
  let p=freeAdj(tx,ty,w,h,true);
  if(p)return p;
  // clear a tree beside it, then carve a way from spawn
  const c=[[tx+(w>>1),ty+h],[tx-1,ty],[tx+w,ty],[tx,ty-1]];
  for(const q of c){
    if(!inb(q[0],q[1]))continue;
    const g=tiles[q[1]*MW+q[0]];
    if(g===TR||g===RK||g===BU){tiles[q[1]*MW+q[0]]=GR;SOLID[q[1]*MW+q[0]]=0}
    if(SOLID[q[1]*MW+q[0]])continue;
    if(clearTo(q[0],q[1])){flood(Math.floor(spawn.x/T),Math.floor(spawn.y/T));
      if(reach[q[1]*MW+q[0]])return q}
  }
  return freeAdj(tx,ty,w,h,false);
}
function openSpot(minY,maxY,minDist,from){
  for(let i=0;i<300;i++){
    const tx=ri(3,MW-4),ty=ri(Math.max(3,minY|0),Math.min(MH-6,maxY|0));
    const ii=ty*MW+tx;
    if(SOLID[ii]||tiles[ii]===WA||!reach[ii])continue;
    const x=tx*T+8,y=ty*T+8;
    if(buildingAt(x,y))continue;
    if(minDist&&from&&Math.hypot(x-from.x,y-from.y)<minDist)continue;
    return{x:x,y:y};
  }
  return{x:spawn.x,y:spawn.y};
}

function genMap(){
  const d=D(),lv=night-1;
  MW=Math.min(MAXW,d.mw+lv*5);MH=Math.min(MAXH,d.mh+lv*4);
  WPX=MW*T;HPX=MH*T;
  const N=MW*MH;
  tiles.fill(0);SOLID.fill(0);RES.fill(0);explored.fill(0);bloodG.fill(0);
  for(let i=0;i<N;i++)VAR[i]=Math.random()*256|0;
  buildings=[];conts=[];objs=[];lamps=[];fires=[];traps=[];shots=[];pickups=[];
  corpses=[];gibs=[];stains=[];decals=[];parts=[];noises=[];crackers=[];
  // which ways out exist tonight
  const nEx=mode===0?d.exits:d.kExits;
  const optional=shuffle(['gate','boat','hatch']).slice(0,Math.max(0,nEx-2));
  EX={car:{on:true,parts:{'CAR KEYS':false,'BATTERY':false,'GAS CAN':false},dis:0,gone:false},
    cops:{on:true,fuse:false,power:false,called:false,t:0,here:false,cut:0},
    gate:{on:optional.includes('gate'),open:false,jam:0},
    boat:{on:optional.includes('boat'),key:false,dis:0,gone:false},
    hatch:{on:optional.includes('hatch'),found:false,open:false}};
  // border woods
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++)
    if(x<2||y<2||x>=MW-2||y>=MH-2)tset(x,y,TR,1);
  // the county road along the south edge
  const ry=MH-4;
  for(let x=0;x<MW;x++){tset(x,ry,RD,0);tset(x,ry+1,RD,0);RES[ry*MW+x]=1;RES[(ry+1)*MW+x]=1}
  // north gate
  const gx=ri(8,MW-10);
  gate={tx:gx,ty:2,x:gx*T+16,y:2*T+8,ax:gx*T+16,ay:3*T+10,outX:gx*T+16,outY:T*0.5};
  if(EX.gate.on){
    for(let y=0;y<2;y++){tset(gx,y,RD,0);tset(gx+1,y,RD,0)}
    for(let x=gx-4;x<gx+6;x++)tset(x,2,FE,1);
    tset(gx,2,GT,1);tset(gx+1,2,GT,1);
    reserve(gx-5,2,12,4,0);
  }
  // the lake
  const lw=Math.max(5,MW*rr(0.08,0.12)),lh=Math.max(4,MH*rr(0.08,0.11));
  let lcx=rr(lw+5,MW-lw-5),lcy=rr(lh+5,MH*0.55);
  if(EX.gate.on&&Math.abs(lcx-gx)<lw+4&&lcy<lh+8)lcy=lh+9;
  const blobs=[[lcx,lcy,lw,lh]];
  for(let i=0;i<3;i++)blobs.push([lcx+rr(-lw,lw)*0.7,lcy+rr(-lh,lh)*0.6,lw*rr(0.4,0.7),lh*rr(0.4,0.7)]);
  for(let y=3;y<MH-7;y++)for(let x=3;x<MW-3;x++){
    if(RES[y*MW+x])continue;
    for(const b of blobs){const ex=(x-b[0])/b[2],ey=(y-b[1])/b[3];
      if(ex*ex+ey*ey<1){tset(x,y,WA,1);break}}
  }
  for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){
    if(tget(x,y)!==GR)continue;
    for(let k=0;k<8;k++)if(tget(x+DX8[k],y+DY8[k])===WA){tset(x,y,SA,0);break}
  }
  // the dock, reaching from the shore nearest camp toward the middle of the lake
  boat={ok:false};
  {
    const tx=MW/2,ty=MH*0.7;let ax=lcx,ay=lcy;
    const dx=tx-lcx,dy=ty-lcy,dl=Math.hypot(dx,dy)||1;
    let shore=null;
    for(let s=0;s<60;s++){
      const x=Math.round(ax+dx/dl*s*0.5),y=Math.round(ay+dy/dl*s*0.5);
      if(tget(x,y)===SA){shore=[x,y];break}
    }
    if(shore){
      // straight out along one axis so every plank touches the next
      let ux=-dx/dl,uy=-dy/dl;
      if(Math.abs(ux)>Math.abs(uy)){ux=Math.sign(ux);uy=0}else{uy=Math.sign(uy);ux=0}
      if(tget(shore[0]+ux,shore[1]+uy)!==WA){
        for(const d of [[1,0],[-1,0],[0,1],[0,-1]])if(tget(shore[0]+d[0],shore[1]+d[1])===WA&&tget(shore[0]+d[0]*3,shore[1]+d[1]*3)===WA){ux=d[0];uy=d[1];break}
      }
      const dock=[];
      for(let s=1;s<7;s++){
        const x=Math.round(shore[0]+ux*s),y=Math.round(shore[1]+uy*s);
        if(tget(x,y)!==WA)break;
        dock.push([x,y]);
      }
      if(dock.length>=3){
        const end=dock[dock.length-2];
        for(let i=0;i<dock.length-1;i++)tset(dock[i][0],dock[i][1],DK,0);
        const bt=dock[dock.length-1];
        boat={ok:true,tx:bt[0],ty:bt[1],x:bt[0]*T+8,y:bt[1]*T+8,ax:end[0]*T+8,ay:end[1]*T+8,
          base:shore};
        reserve(shore[0]-1,shore[1]-1,3,3,0);
      }
    }
  }
  if(!boat.ok)EX.boat.on=false;
  // the lodge
  let lodge=null;
  for(let tr=0;tr<400&&!lodge;tr++){
    const w=ri(12,14),h=ri(7,8);
    const tx=ri(Math.floor(MW*0.25),Math.floor(MW*0.75)-w),ty=ri(Math.floor(MH*0.3),Math.floor(MH*0.7)-h);
    if(canPlace(tx,ty,w,h,2))lodge=makeBuilding(tx,ty,w,h,'LODGE',2);
  }
  if(!lodge){
    for(let tr=0;tr<800&&!lodge;tr++){
      const w=12,h=7,tx=ri(3,MW-w-4),ty=ri(3,MH-h-7);
      if(canPlace(tx,ty,w,h,1))lodge=makeBuilding(tx,ty,w,h,'LODGE',2);
    }
  }
  // phone inside the lodge, generator outside it
  if(lodge){
    const px=lodge.tx+(lodge.w>>1),py=lodge.ty+1;
    SOLID[py*MW+px]=1;
    phone={tx:px,ty:py,x:px*T+8,y:py*T+8,ax:px*T+8,ay:(py+1)*T+8};
    furnish(lodge,shuffle(['LOCKER','LOCKER','DESK','FRIDGE','CHEST','WARDROBE','DESK']).slice(0,5));
    let gp=null;
    const gc=[[lodge.tx+lodge.w+1,lodge.ty+lodge.h-2],[lodge.tx-2,lodge.ty+lodge.h-2],
      [lodge.tx+lodge.w+1,lodge.ty+1],[lodge.tx-2,lodge.ty+1],[lodge.tx+2,lodge.ty-2]];
    for(const c of gc)if(inb(c[0],c[1])&&tget(c[0],c[1])===GR&&!SOLID[c[1]*MW+c[0]]&&c[0]>2&&c[0]<MW-3&&c[1]>2){gp=c;break}
    if(!gp)gp=[lodge.tx+lodge.w+1,lodge.ty+lodge.h-2];
    tset(gp[0],gp[1],GR,1);reserve(gp[0]-1,gp[1]-1,3,3,0);
    gen={tx:gp[0],ty:gp[1],x:gp[0]*T+8,y:gp[1]*T+8,ax:gp[0]*T+8,ay:(gp[1]+1)*T+8};
  }
  // cabins and sheds
  const nC=Math.round(MW*MH/430);
  for(let i=0,tries=0;i<nC&&tries<900;tries++){
    const w=ri(6,8),h=ri(5,6),tx=ri(3,MW-w-4),ty=ri(3,MH-h-7);
    if(!canPlace(tx,ty,w,h,2))continue;
    const b=makeBuilding(tx,ty,w,h,'CABIN',1);
    const pool=shuffle(['CHEST','DRESSER','WARDROBE','BED','DESK','CHEST']);
    furnish(b,pool.slice(0,ri(2,3)));
    if(Math.random()<0.5)placeNear(b,'CRATE',Math.random()<0.5?'CRATE':'BARREL');
    i++;
  }
  const nS=1+Math.round(MW*MH/1600);
  for(let i=0,tries=0;i<nS&&tries<500;tries++){
    const tx=ri(3,MW-8),ty=ri(3,MH-10);
    if(!canPlace(tx,ty,4,4,2))continue;
    const b=makeBuilding(tx,ty,4,4,'SHED',1);
    furnish(b,shuffle(['TOOLBOX','WORKBENCH']));
    i++;
  }
  if(lodge)placeNear(lodge,'DUMPSTER','DUMPSTER');
  // things in the open
  const area=MW*MH;
  const props=[['TENT',2,2,'TENT',Math.round(area/1300)],['OLDCAR',3,2,'TRUNK',Math.max(1,Math.round(area/2600))],
    ['PICNIC',2,1,'COOLER',Math.round(area/1800)],['OUTHOUSE',1,1,'OUTHOUSE',Math.max(1,Math.round(area/2400))],
    ['LOGPILE',2,1,'LOGPILE',Math.round(area/2200)],['CRATE',1,1,'CRATE',Math.round(area/900)],
    ['BARREL',1,1,'BARREL',Math.round(area/1300)],['CAMPFIRE',1,1,null,2+Math.round(area/3500)]];
  for(const p of props)for(let i=0;i<p[4];i++)placeProp(p[0],p[1],p[2],p[3]);
  // the car, parked on the road
  const carTx=ri(4,MW-8);
  for(let x=carTx;x<carTx+3;x++)SOLID[ry*MW+x]=1;
  car={tx:carTx,x:carTx*T,y:ry*T,ax:carTx*T+24,ay:(ry+1)*T+8,cx:carTx*T+24,cy:ry*T+8};
  const copTx=carTx<MW/2?ri(Math.floor(MW*0.6),MW-6):ri(4,Math.floor(MW*0.4));
  copSpot={x:copTx*T+16,y:(ry+1)*T+8};
  // paths between everything that matters
  const nodes=[];
  for(const b of buildings)for(const dd of b.doors)nodes.push([dd.tx,dd.ty+1]);
  if(gen.tx)nodes.push([gen.tx,gen.ty+1]);
  nodes.push([carTx+1,ry-1]);
  if(boat.ok)nodes.push(boat.base);
  if(EX.gate.on)nodes.push([gx,3]);
  for(const o of objs)if(o.kind==='CAMPFIRE'||o.kind==='TENT'||o.kind==='OLDCAR')nodes.push([o.tx,o.ty+o.h]);
  const inT=[0],rest=nodes.map((n,i)=>i).slice(1);
  while(rest.length){
    let best=-1,bi=-1,bd=1e9;
    for(const a of inT)for(let j=0;j<rest.length;j++){
      const b=nodes[rest[j]],dd=Math.hypot(nodes[a][0]-b[0],nodes[a][1]-b[1]);
      if(dd<bd){bd=dd;best=a;bi=j}}
    const tgt=rest.splice(bi,1)[0];inT.push(tgt);
    const A=nodes[best],B=nodes[tgt];
    const p=astar(A[0],A[1],B[0],B[1],2,30000);
    if(p)walk4(A[1]*MW+A[0],p,i=>{if(tiles[i]===GR||tiles[i]===SA)tiles[i]=PA});
  }
  // lamps along the paths
  for(let y=3;y<MH-5;y++)for(let x=3;x<MW-3;x++){
    if(tiles[y*MW+x]!==PA||Math.random()>0.07)continue;
    const c=[[x+1,y],[x-1,y],[x,y+1],[x,y-1]];
    for(const q of c){
      const i=q[1]*MW+q[0];
      if(tiles[i]!==GR||SOLID[i]||RES[i])continue;
      if(lamps.some(L=>Math.abs(L.tx-q[0])+Math.abs(L.ty-q[1])<9))break;
      SOLID[i]=1;RES[i]=1;
      lamps.push({tx:q[0],ty:q[1],x:q[0]*T+8,y:q[1]*T+4});break;
    }
  }
  // the woods
  const nz=noiseGrid(7),dens=rr(0.85,1.25);
  for(let y=2;y<MH-4;y++)for(let x=2;x<MW-2;x++){
    const i=y*MW+x;
    if(tiles[i]!==GR||RES[i]||SOLID[i])continue;
    const n=nz(x,y);
    const p=(Math.max(0,(n-0.42)*1.7)+0.035)*dens;
    const r=Math.random();
    if(r<p)tset(x,y,TR,1);
    else if(r<p+0.025)tset(x,y,BU,0);
    else if(r<p+0.032)tset(x,y,RK,1);
  }
  // spawn: on a path near the bottom middle
  let sp=null,sd=1e9;
  for(let y=Math.floor(MH*0.5);y<MH-5;y++)for(let x=3;x<MW-3;x++){
    if(tiles[y*MW+x]!==PA||SOLID[y*MW+x])continue;
    const dd=Math.hypot(x-MW/2,y-(MH-8));
    if(dd<sd){sd=dd;sp=[x,y]}
  }
  if(!sp){for(let tr=0;tr<500&&!sp;tr++){const x=ri(4,MW-5),y=ri(Math.floor(MH*0.5),MH-6);
    if(!SOLID[y*MW+x]&&tiles[y*MW+x]!==WA)sp=[x,y]}}
  if(!sp)sp=[MW>>1,MH-6];
  tset(sp[0],sp[1],PA,0);
  spawn={x:sp[0]*T+8,y:sp[1]*T+8};
  // the hatch: somewhere deep in the trees
  hatch={ok:false};
  if(EX.hatch.on){
    let best=null,bs=-1;
    for(let tr=0;tr<500;tr++){
      const x=ri(4,MW-5),y=ri(4,MH-8),i=y*MW+x;
      if(tiles[i]!==GR||RES[i]||SOLID[i])continue;
      let c=0;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(tget(x+dx,y+dy)===TR)c++;
      const far=Math.hypot(x*T-spawn.x,y*T-spawn.y)>MW*T*0.3;
      const sc=c+(far?6:0);
      if(sc>bs){bs=sc;best=[x,y]}
    }
    if(best){
      for(let k=0;k<4;k++){const nx=best[0]+DX8[k],ny=best[1]+DY8[k];if(tget(nx,ny)===TR)tset(nx,ny,GR,0)}
      hatch={ok:true,tx:best[0],ty:best[1],x:best[0]*T+8,y:best[1]*T+8,ax:best[0]*T+8,ay:best[1]*T+8};
      RES[best[1]*MW+best[0]]=1;
    }else EX.hatch.on=false;
  }
  // make sure everything that matters can actually be reached
  flood(sp[0],sp[1]);
  for(const c of conts){
    const p=ensureReach(c.tx,c.ty,c.w,c.h);
    if(p){c.ax=p[0]*T+8;c.ay=p[1]*T+8}else{c.ax=c.x;c.ay=c.y+12;c.searched=true}
  }
  const must=[];
  if(gen.tx)must.push(gen);if(phone.tx)must.push(phone);
  for(const m of must){const p=ensureReach(m.tx,m.ty,1,1);if(p){m.ax=p[0]*T+8;m.ay=p[1]*T+8}}
  {const ax=Math.floor(car.ax/T),ay=Math.floor(car.ay/T);if(!reach[ay*MW+ax])clearTo(ax,ay)}
  if(boat.ok){const ax=Math.floor(boat.ax/T),ay=Math.floor(boat.ay/T);
    if(!reach[ay*MW+ax])clearTo(ax,ay)}
  if(hatch.ok&&!reach[hatch.ty*MW+hatch.tx])clearTo(hatch.tx,hatch.ty);
  if(EX.gate.on&&!reach[3*MW+gx])clearTo(gx,3);
  flood(sp[0],sp[1]);
  fillContainers();
  // the ones who didn't make it
  const nc=1+ri(0,2);
  for(let i=0;i<nc;i++){
    const s=openSpot(5,MH-8,140,spawn),c=pick(CNAMES);
    corpses.push({x:s.x,y:s.y,found:false,name:c[0],shirt:c[1],hair:c[2],pants:pick(PANTS),
      kind:pick(['headless','gutted','split','crushed','whole','impaled']),old:true});
    for(let k=0;k<4;k++)addStain(s.x+rr(-8,8),s.y+rr(-4,6),rr(2,6));
  }
  // a few weapons already lying in the grass
  for(let i=0;i<2;i++){const s=openSpot(5,MH-6);pickups.push({x:s.x,y:s.y,item:pick(['KNIFE','BAT','PIPE'])})}
}
function fillContainers(){
  const d=D();
  const quest=['CAR KEYS','BATTERY','GAS CAN','FUSE'];
  if(EX.gate.on)quest.push('GATE KEY');
  if(EX.boat.on)quest.push('BOAT KEY');
  if(EX.hatch.on)quest.push('HATCH KEY');
  const avail=shuffle(conts.filter(c=>!c.searched));
  const used=[];
  for(const q of quest){
    let best=null;
    for(const c of avail){
      if(used.includes(c))continue;
      if(Math.hypot(c.x-spawn.x,c.y-spawn.y)<T*8)continue;
      if(used.some(u=>Math.hypot(u.x-c.x,u.y-c.y)<T*10))continue;
      // engine parts like sheds and car trunks
      if((q==='BATTERY'||q==='GAS CAN')&&!['TOOLBOX','WORKBENCH','TRUNK','CRATE','LOGPILE'].includes(c.type)&&Math.random()<0.6)continue;
      best=c;break;
    }
    if(!best)best=avail.find(c=>!used.includes(c));
    if(best){best.items.push(q);used.push(best)}
  }
  const lv=night-1,ex=d.extras*Math.max(0.6,1-lv*0.06);
  const bonus=[];
  for(let i=0;i<Math.max(1,d.meds-Math.floor(lv/2));i++)bonus.push('MEDKIT');
  for(let i=0;i<Math.round(3*ex);i++)bonus.push('BANDAGE');
  bonus.push('FLASHLIGHT');if(ex>1.2)bonus.push('FLASHLIGHT');
  for(let i=0;i<Math.max(1,Math.round(1.5*ex));i++)bonus.push('FLARE GUN');
  for(let i=0;i<Math.round(2*ex);i++)bonus.push('BEAR TRAP');
  for(let i=0;i<Math.round(2*ex);i++)bonus.push('FIRECRACKER');
  bonus.push('MAP');
  for(let i=0;i<Math.round(3*ex)+1;i++)bonus.push(pick(WPNN));
  const rest=shuffle(avail.filter(c=>!used.includes(c)));
  shuffle(bonus);
  for(let i=0;i<bonus.length;i++){
    const c=rest.length?rest[i%rest.length]:avail[i%avail.length];
    if(c&&c.items.length<2)c.items.push(bonus[i]);
  }
}

function D(){return DIFFS[diffI]}
function S(){return SLASHERS[kSlash]}
function has(p){return run.perks.includes(p)}
function lvl(){return night-1}
function humans(){return mode===0?npcs:cons}
function msg(t,dur){
  if(msgs.length&&msgs[msgs.length-1].t===t){msgs[msgs.length-1].d=dur||2.6;return}
  msgs.push({t:t,d:dur||2.6});if(msgs.length>5)msgs.shift();
}
function say(c,t,dur){c.say={t:t,d:dur||2.4}}
function announce(c,t,dur){say(c,t,dur);msg(c.name+': '+t,dur||3)}
function noise(x,y,r,pri){
  if(weather==='RAIN')r*=0.75;
  noises.push({x:x,y:y,r:r,pri:pri||0,t:0.3});
}
function carNeeds(){return Object.keys(EX.car.parts).filter(k=>!EX.car.parts[k])}
function carReady(){return EX.car.on&&!EX.car.gone&&carNeeds().length===0&&EX.car.dis<=0}
function boatReady(){return EX.boat.on&&!EX.boat.gone&&EX.boat.key&&EX.boat.dis<=0}
function rectDist(px,py,x,y,w,h){
  const dx=Math.max(x-px,0,px-(x+w)),dy=Math.max(y-py,0,py-(y+h));
  return Math.hypot(dx,dy);
}
function contDist(c,e){return rectDist(e.x,e.y,c.tx*T,c.ty*T,c.w*T,c.h*T)}
function clockMin(){return 21*60+elapsed*(540/nightLen())}
function nightLen(){return D().len*(mode===1?0.75:1)*(1+lvl()*0.05)}
function clockStr(){
  const m=clockMin(),hh24=(m/60|0)%24,mm=(m%60)|0;
  const ap=hh24>=12?'PM':'AM';let h=hh24%12;if(h===0)h=12;
  return h+':'+(mm<10?'0':'')+mm+' '+ap;
}
function nightProg(){return Math.min(1,elapsed/nightLen())}
function quota(){return Math.max(1,Math.round(stats.total*D().quota))}

/* ---------------- FX ---------------- */
function blood(x,y,n,big,up){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,sp=(big?30:14)+Math.random()*(big?80:40);
    parts.push({k:big?'B':'b',x:x,y:y,z:4+Math.random()*8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.6,
      vz:(up||30)+Math.random()*60,life:2});
  }
}
function spurt(x,y,z,dirx,n,force,up){
  for(let i=0;i<n;i++)parts.push({k:'B',x:x,y:y,z:z,vx:dirx*force*(0.4+Math.random())+rr(-12,12),
    vy:rr(-10,10),vz:(up||90)+Math.random()*60,life:2});
}
function addStain(x,y,r){
  stains.push({x:x,y:y,r:r,s:Math.random()<0.5?0:1});
  if(stains.length>700)stains.shift();
  const tx=Math.floor(x/T),ty=Math.floor(y/T);
  if(inb(tx,ty)){const i=ty*MW+tx;bloodG[i]=Math.min(255,bloodG[i]+Math.round(r*12))}
}
function smoke(x,y,n){
  for(let i=0;i<n;i++)parts.push({k:'s',x:x,y:y,z:4,vx:(Math.random()-0.5)*40,
    vy:(Math.random()-0.5)*30,vz:10+Math.random()*20,life:0.5+Math.random()*0.3});
}
function sparks(x,y,n,col){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=40+Math.random()*90;
    parts.push({k:'p',x:x,y:y,z:6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp*0.5,vz:30+Math.random()*60,
      life:0.25+Math.random()*0.3,c:col||'#ffd060'})}
}
function gib(x,y,z,kind,c1,c2,vx,vy,vz,extra){
  const g={x:x,y:y,z:z,vx:vx,vy:vy,vz:vz,kind:kind,c1:c1,c2:c2,rot:0,vr:rr(-12,12),rest:false};
  if(extra)Object.assign(g,extra);
  gibs.push(g);
  if(gibs.length>180){const i=gibs.findIndex(q=>q.rest);gibs.splice(i>=0?i:0,1)}
}
function dropAt(x,y,item,t){
  const e={x:x,y:y};unstick(e,3,3,false);
  pickups.push({x:e.x,y:e.y,item:item,t:t||0,claim:null});
}
function tossItem(x,y,item,r,t){
  for(let tr=0;tr<30;tr++){
    const a=Math.random()*Math.PI*2,d=r*(0.5+Math.random()*0.5);
    const nx=x+Math.cos(a)*d,ny=y+Math.sin(a)*d;
    const tx=Math.floor(nx/T),ty=Math.floor(ny/T);
    if(nx>2*T&&ny>2*T&&nx<WPX-2*T&&ny<HPX-3*T&&freeBox(nx,ny,4,4,false)&&reach[ty*MW+tx]){
      pickups.push({x:nx,y:ny,item:item,t:t||0,claim:null});return}
  }
  dropAt(x,y,item,t);
}
function mkHuman(c,x,y,hp){
  return{x:x,y:y,hp:hp,maxhp:hp,name:c[0],shirt:c[1],hair:c[2],pants:pick(PANTS),
    skin:pick(['#c89a6a','#a87a4a','#e0b08a','#7a5232','#c89a6a']),
    stam:100,inv:[],weapon:null,wDur:0,med:0,lantern:Math.random()<0.45,
    goal:null,act:null,think:Math.random()*0.4,fleeT:0,
    down:false,downT:0,dead:false,escaped:false,hide:null,hideT:0,fin:false,
    say:null,sayCd:0,fx:0,fy:1,walkT:0,moving:false,hurtCd:0,atkCd:0,waitT:0,
    path:null,pi:0,navT:0,pT:null,bloodSteps:0,stepT:0,panic:0,alarmed:mode===0};
}
function spotNear(x,y,r){
  for(let i=0;i<60;i++){
    const nx=x+rr(-r,r),ny=y+rr(-r,r);
    const tx=Math.floor(nx/T),ty=Math.floor(ny/T);
    if(inb(tx,ty)&&reach[ty*MW+tx]&&freeBox(nx,ny,4,5,false))return{x:nx,y:ny};
  }
  return{x:x,y:y};
}

function explore(){
  const r=P.mapped?0:7,cx=Math.floor(P.x/T),cy=Math.floor(P.y/T);
  for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)
    if(inb(x,y)&&(x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r)explored[y*MW+x]=1;
}

/* ---------------- INPUT ---------------- */
const input={dx:0,dy:0,sprint:false};
let joyId=null,joyAx=0,joyAy=0;
const BTN_A={x:0,y:0,r:17},BTN_B={x:0,y:0,r:12},BTN_C={x:0,y:0,r:11};
let mmRect={x:0,y:0,w:0,h:0},itemRect={x:0,y:0,w:0,h:0};
function layoutButtons(){
  BTN_A.x=VW-30;BTN_A.y=VH-34;BTN_B.x=VW-68;BTN_B.y=VH-20;BTN_C.x=VW-62;BTN_C.y=VH-58;
}
const keys={};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k===' '||k.startsWith('arrow')||k==='tab')e.preventDefault();
  if(e.repeat)return;
  keys[k]=true;
  unlockAudio();
  if(state===1){
    if(cine)return;
    if(k===' '||k==='j')doAction();
    else if((k==='k'||k==='shift')&&mode===1)usePower();
    else if(k==='e'||k==='l')useC();
    else if(k==='q')cycleItem();
    else if(k==='m'||k==='tab')mapOpen=!mapOpen;
    else if(k==='p'||k==='escape'){state=10;menuSel=0;stateT=0}
  }else{
    if(state===10&&(k==='p'||k==='escape')){state=1;return}
    const L=menuLayout();
    if(k==='arrowup'||k==='w'){menuSel=Math.max(0,menuSel-1);sfxSel()}
    if(k==='arrowdown'||k==='s'){menuSel=Math.min(Math.max(0,L.n-1),menuSel+1);sfxSel()}
    if(k==='enter'||k===' ')menuPick(menuSel);
  }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;input.dx=input.dy=0;input.sprint=false;joyId=null});

function canvasXY(t){
  const r=cv.getBoundingClientRect();
  return{x:(t.clientX-r.left)/r.width*VW,y:(t.clientY-r.top)/r.height*VH};
}
function inC(p,b){const dx=p.x-b.x,dy=p.y-b.y;return dx*dx+dy*dy<=b.r*b.r*1.7}
function inR(p,r){return p.x>=r.x&&p.y>=r.y&&p.x<=r.x+r.w&&p.y<=r.y+r.h}
const bTouch={a:null,b:null,c:null};

function menuLayout(){
  if(state===4)return{y0:100,sp:28,n:2};
  if(state===5)return{y0:82,sp:32,n:3};
  if(state===6)return{y0:58,sp:36,n:4};
  if(state===8)return{y0:52,sp:25,n:KWN.length};
  if(state===9)return{y0:84,sp:34,n:perkChoices.length};
  if(state===10)return{y0:100,sp:26,n:2};
  return{y0:0,sp:0,n:0};
}
function menuPick(i){
  unlockAudio();
  if(stateT<0.25)return;
  sfxSel();
  if(state===0){state=4;menuSel=0;stateT=0}
  else if(state===4){mode=i;state=5;menuSel=diffI;stateT=0}
  else if(state===5){diffI=i;run={score:0,perks:[]};
    if(mode===1){state=6;menuSel=slasherSel;stateT=0}
    else{night=1;prepNight()}}
  else if(state===6){slasherSel=i;state=8;menuSel=weaponSel;stateT=0}
  else if(state===8){
    if(KW[KWN[i]].unlock>save.kills){sfxBuzz();return}
    weaponSel=i;night=1;prepNight()}
  else if(state===7)startPlay();
  else if(state===2){night=1;state=0;menuSel=0;stateT=0}
  else if(state===3){
    perkChoices=shuffle((mode===0?PERKS_S:PERKS_K).filter(p=>!run.perks.includes(p.id))).slice(0,3);
    if(perkChoices.length){state=9;menuSel=0;stateT=0}
    else{night++;prepNight()}
  }
  else if(state===9){
    const p=perkChoices[i];if(p)run.perks.push(p.id);
    night++;prepNight();
  }
  else if(state===10){
    if(i===0)state=1;
    else{endRun();state=0;menuSel=0;stateT=0}
  }
}
function menuHit(p){
  const L=menuLayout();
  if(state!==10)p={x:p.x,y:p.y-MOY};
  if(!L.n)return -2;
  const i=Math.floor((p.y-L.y0+8)/L.sp);
  if(i>=0&&i<L.n&&p.y>=L.y0-8)return i;
  return -1;
}
function menuTap(p){
  if(stateT<0.4)return;
  const mi=menuHit(p);
  if(mi>=0){
    if(menuSel===mi||state===4||state===5||state===10)menuPick(mi);
    else{menuSel=mi;sfxSel()}
  }else if(mi===-2)menuPick(0);
}
cv.addEventListener('touchstart',e=>{
  e.preventDefault();unlockAudio();
  if(state!==1){
    for(const t of e.changedTouches)menuTap(canvasXY(t));
    return;
  }
  if(cine)return;
  for(const t of e.changedTouches){
    const p=canvasXY(t);
    if(inC(p,BTN_A)){bTouch.a=t.identifier;doAction()}
    else if(inC(p,BTN_B)){bTouch.b=t.identifier;if(mode===1)usePower();else input.sprint=true}
    else if(inC(p,BTN_C)){bTouch.c=t.identifier;useC()}
    else if(p.y<16&&Math.abs(p.x-VW/2)<34){state=10;menuSel=0;stateT=0}
    else if(inR(p,mmRect)||(mapOpen&&p.x>VW*0.3)){mapOpen=!mapOpen}
    else if(inR(p,itemRect))cycleItem();
    else if(p.x<VW*0.55&&joyId===null){joyId=t.identifier;joyAx=p.x;joyAy=p.y}
  }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const p=canvasXY(t);
      let dx=p.x-joyAx,dy=p.y-joyAy;
      const m=Math.hypot(dx,dy);
      if(m>5){input.dx=dx/m*Math.min(1,m/14);input.dy=dy/m*Math.min(1,m/14)}else{input.dx=0;input.dy=0}
      if(m>26){joyAx=p.x-dx/m*26;joyAy=p.y-dy/m*26}
    }
  }
},{passive:false});
function tEnd(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;input.dx=0;input.dy=0}
    if(t.identifier===bTouch.a)bTouch.a=null;
    if(t.identifier===bTouch.b){bTouch.b=null;input.sprint=false}
    if(t.identifier===bTouch.c)bTouch.c=null;
  }
}
cv.addEventListener('touchend',tEnd,{passive:false});
cv.addEventListener('touchcancel',tEnd,{passive:false});
cv.addEventListener('mousedown',e=>{
  unlockAudio();
  const p=canvasXY(e);
  if(state!==1){menuTap(p);return}
  if(p.y<16&&Math.abs(p.x-VW/2)<34){state=10;menuSel=0;stateT=0}
  else if(inR(p,mmRect)||mapOpen)mapOpen=!mapOpen;
  else if(inR(p,itemRect))cycleItem();
});

/* ---------------- CHANNELED ACTIONS ---------------- */
function startChan(kind,dur,label,data){
  chan=Object.assign({kind:kind,t:0,dur:dur,label:label},data||{});sfxTick();
}
const CHAN_NOISE={restart:170,boat:210,drive:130,install:80,search:45,call:60,gate:80,fuse:60,
  boatkey:50,hatch:50,climb:30,revive:40};
function tickChan(dt){
  if(!chan)return;
  if(P.moving||P.hurtCd>0.3||P.down||P.hide){chan=null;return}
  chan.t+=dt;
  if((chan.t*5|0)!==((chan.t-dt)*5|0))sfxTick();
  P.noiseT-=dt;
  if(P.noiseT<=0){P.noiseT=0.5;noise(P.x,P.y,(CHAN_NOISE[chan.kind]||40)*(has('LIGHT STEP')?0.5:1))}
  if(chan.t<chan.dur)return;
  const c=chan;chan=null;
  const take=it=>{const i=P.q.indexOf(it);if(i>=0)P.q.splice(i,1)};
  switch(c.kind){
    case 'search':revealCont(c.c,P);break;
    case 'install':
      if(P.q.includes(c.item)){take(c.item);EX.car.parts[c.item]=true;sfxKeyItem();
        msg(carReady()?'THE CAR IS READY. DRIVE!':('INSTALLED THE '+c.item+'.'),3)}
      break;
    case 'fuse':take('FUSE');EX.cops.fuse=true;EX.cops.power=true;sfxHum();msg('THE LIGHTS HUM TO LIFE.',3);break;
    case 'restart':EX.cops.power=true;sfxHum();msg('POWER RESTORED.');break;
    case 'call':EX.cops.called=true;EX.cops.t=D().cops;sfxRing();msg('POLICE ARE COMING. STAY ALIVE.',3.5);break;
    case 'gate':take('GATE KEY');openGate();msg('THE GATE SWINGS OPEN. GO NORTH!',3.5);break;
    case 'boatkey':take('BOAT KEY');EX.boat.key=true;sfxKeyItem();msg('THE KEY TURNS. THE BOAT IS READY.',3);break;
    case 'boat':sfxEngine();winNight('BOAT');break;
    case 'hatch':take('HATCH KEY');EX.hatch.open=true;sfxDoor();msg('THE HATCH IS OPEN.',3);break;
    case 'climb':winNight('HATCH');break;
    case 'drive':sfxEngine();winNight('CAR');break;
    case 'revive':
      if(c.c&&c.c.down&&!c.c.dead){c.c.down=false;c.c.hp=2;c.c.fleeT=0;say(c.c,'THANK YOU!');sfxPickup()}
      break;
  }
}
function openGate(){
  EX.gate.open=true;
  tset(gate.tx,2,GT,0);tset(gate.tx+1,2,GT,0);
  sfxDoor();
}
function revealCont(c,who){
  if(c.searched&&who!==P&&!c.items.length)return;
  c.searched=true;c.claim=null;
  const items=c.items.splice(0);
  if(who===P){
    if(!items.length){
      if(has('SCAVENGER')&&Math.random()<0.35)items.push(pick(['BANDAGE','FIRECRACKER','BEAR TRAP','MEDKIT']));
      else{msg(pick(['NOTHING.','EMPTY.','JUST MOTHS.','NOTHING USEFUL.','OLD MAGAZINES.']));sfxTick();return}
    }
    for(const it of items)giveP(it,c);
  }else npcLoot(who,items,c);
}
function hintFor(it){
  const h={'CAR KEYS':'THE CAR NEEDS THESE.','BATTERY':'THE CAR NEEDS THIS.','GAS CAN':'THE CAR NEEDS THIS.',
    'FUSE':'THE GENERATOR NEEDS THIS.','GATE KEY':'THE NORTH GATE.','BOAT KEY':'THE BOAT AT THE DOCK.',
    'HATCH KEY':'A HATCH. SOMEWHERE IN THE WOODS.'}[it];
  if(h)msg(h,3.2);
}
function giveP(it,src){
  if(IT[it].q){P.q.push(it);msg('FOUND THE '+it+'!',3);sfxKeyItem();hintFor(it);return}
  sfxPickup();
  switch(it){
    case 'MEDKIT':P.c.MEDKIT++;msg('MEDKIT. PRESS C TO USE.');break;
    case 'BANDAGE':P.c.BANDAGE++;msg('BANDAGES.');break;
    case 'FLARE GUN':P.c.FLARE+=2;msg('FLARE GUN. 2 FLARES.');break;
    case 'BEAR TRAP':P.c.TRAP++;msg('A BEAR TRAP.');break;
    case 'FIRECRACKER':P.c.FIRECRACKER+=2;msg('FIRECRACKERS. THROW TO DISTRACT HIM.',3);break;
    case 'FLASHLIGHT':
      if(P.torch){P.c.BANDAGE++;msg('ANOTHER FLASHLIGHT. AND A BANDAGE.')}
      else{P.torch=true;P.torchOn=true;msg('A FLASHLIGHT. HE CAN SEE IT TOO.',3)}
      break;
    case 'MAP':explored.fill(1,0,MW*MH);P.mapped=true;msg('A CAMP MAP. PRESS M TO READ IT.',3);break;
    default:
      if(IT[it]&&IT[it].w){
        if(!P.weapon||WPN[it].d>=WPN[P.weapon].d){
          if(P.weapon)dropAt(P.x,P.y+8,P.weapon,2);
          P.weapon=it;P.wDur=WPN[it].dur+(has('IRON GRIP')?2:0);
          msg('FOUND: '+it+' ('+P.wDur+' HITS)');
        }else{dropAt(src?src.ax:P.x,src?src.ay:P.y+8,it,2);msg('A '+it+'. YOURS IS BETTER.')}
      }
  }
  autoSel();
}
function npcLoot(c,items,src){
  for(const it of items){
    if(IT[it].q){
      if(c.inv.length<2){c.inv.push(it);announce(c,'FOUND THE '+it+'!');}
      else dropAt(src.ax,src.ay,it);
    }else if(it==='MEDKIT'||it==='BANDAGE')c.med++;
    else if(IT[it].w){
      if(!c.weapon||WPN[it].d>WPN[c.weapon].d){
        if(c.weapon)dropAt(src.ax,src.ay,c.weapon,1);
        c.weapon=it;c.wDur=3;say(c,'GOT A '+it+'.');
      }else dropAt(src.ax,src.ay,it,1);
    }else if(it==='FLASHLIGHT'&&!c.lantern)c.lantern=true;
    else if(mode===0){dropAt(src.ax,src.ay,it,1);say(c,'LEFT A '+it+' HERE.',3)}
  }
}
function askNPC(c){
  if(c.inv.length){
    const got=c.inv.splice(0);
    for(const it of got){P.q.push(it)}
    say(c,'TAKE THE '+got.join(' AND ')+'!',3);
    msg('GOT THE '+got.join(' + ')+' FROM '+c.name+'.',3);sfxKeyItem();
    if(c.goal&&c.goal.item)c.goal=null;
  }else if(P.hp<P.maxhp&&c.med>0){
    c.med--;P.c.MEDKIT++;say(c,'HERE. PATCH YOURSELF UP.');sfxPickup();
  }else say(c,pick(['NOTHING YET. STILL LOOKING.','I GOT NOTHING. KEEP MOVING.','STAY CLOSE.']));
}

/* ---------------- ACTIONS: SURVIVE ---------------- */
function interactTarget(){
  if(P.hide)return{k:'unhide',label:'LEAVE'};
  if(P.down)return null;
  for(const c of npcs)if(c.down&&!c.dead&&!c.fin&&Math.hypot(c.x-P.x,c.y-P.y)<20)
    return{k:'revive',c:c,label:'REVIVE '+c.name};
  const kd=Math.hypot(K.x-P.x,K.y-P.y);
  let fb=null;
  const info=(label,m)=>{if(!fb)fb={k:'msg',label:label,m:m}};
  if(P.weapon&&kd<26&&K.st!=='DOWN')return{k:'attack',label:''};
  if(EX.car.on&&!EX.car.gone&&rectDist(P.x,P.y,car.x,car.y,48,16)<14){
    const need=carNeeds(),have=need.find(n=>P.q.includes(n));
    if(carReady())return{k:'drive',label:'DRIVE!'};
    if(have)return{k:'install',item:have,label:'INSTALL '+have};
    if(EX.car.dis>0)info('GUTTED','SOMEONE TORE THE ENGINE APART. WAIT.');
    else info('NEEDS '+need.map(n=>IT[n].s).join(' '),'THE CAR NEEDS: '+need.join(', '));
  }
  if(gen.tx&&rectDist(P.x,P.y,gen.tx*T,gen.ty*T,T,T)<14){
    if(!EX.cops.fuse){
      if(P.q.includes('FUSE'))return{k:'fuse',label:'INSTALL FUSE'};
      info('NEEDS FUSE','THE GENERATOR NEEDS A FUSE.');
    }else if(!EX.cops.power)return{k:'restart',label:'RESTART'};
    else info('HUMMING','THE GENERATOR HUMS. FIND THE PHONE.');
  }
  if(phone.tx&&rectDist(P.x,P.y,phone.tx*T,phone.ty*T,T,T)<14){
    if(EX.cops.called)info(EX.cops.here?'GO!':'WAIT',EX.cops.here?'GET TO THE ROAD!':'THEY ARE COMING. HOLD ON.');
    else if(!EX.cops.power)info('NO POWER','DEAD LINE. THE GENERATOR IS OFF.');
    else if(EX.cops.cut>0)info('LINE CUT','THE LINE IS DEAD. TRY AGAIN SOON.');
    else return{k:'call',label:'CALL POLICE'};
  }
  if(EX.gate.on&&rectDist(P.x,P.y,gate.tx*T,2*T,32,T)<16){
    if(EX.gate.open)info('GO NORTH!','THE GATE IS OPEN. GO!');
    else if(EX.gate.jam>0)info('JAMMED','THE LOCK IS JAMMED WITH SOMETHING.');
    else if(P.q.includes('GATE KEY'))return{k:'gate',label:'UNLOCK GATE'};
    else info('LOCKED','CHAINED SHUT. NEEDS THE GATE KEY.');
  }
  if(EX.boat.on&&!EX.boat.gone&&Math.hypot(P.x-boat.ax,P.y-boat.ay)<20){
    if(boatReady())return{k:'boat',label:'START BOAT'};
    if(EX.boat.dis>0)info('FLOODED','THE MOTOR IS FLOODED. GIVE IT TIME.');
    else if(!EX.boat.key&&P.q.includes('BOAT KEY'))return{k:'boatkey',label:'INSERT KEY'};
    else info('NEEDS KEY','THE BOAT NEEDS ITS KEY.');
  }
  if(EX.hatch.on&&EX.hatch.found&&Math.hypot(P.x-hatch.x,P.y-hatch.y)<18){
    if(EX.hatch.open)return{k:'climb',label:'CLIMB DOWN'};
    if(P.q.includes('HATCH KEY'))return{k:'hatch',label:'UNLOCK HATCH'};
    info('LOCKED','A PADLOCKED HATCH. NEEDS A KEY.');
  }
  // unsearched first, then a place to hide, then whatever's closest
  let bc=null,bd=13,bu=null,bud=13,bh=null,bhd=13;
  for(const c of conts){
    const dd=contDist(c,P);if(dd>=13)continue;
    if(dd<bd){bd=dd;bc=c}
    if(!c.searched&&dd<bud){bud=dd;bu=c}
    if(c.searched&&c.hide&&!c.occ&&dd<bhd){bhd=dd;bh=c}
  }
  if(bu)return{k:'search',c:bu,label:'SEARCH'};
  if(bh)return{k:'hide',c:bh,label:'HIDE'};
  for(const c of npcs)if(!c.down&&!c.dead&&Math.hypot(c.x-P.x,c.y-P.y)<20)
    return{k:'ask',c:c,label:c.inv.length?'ASK '+c.name:'TALK'};
  if(fb)return fb;
  if(bc)return{k:'msg',label:'EMPTY',m:'NOTHING LEFT HERE.'};
  return{k:'attack',label:''};
}
function doAction(){
  if(state!==1||cine)return;
  if(mode===1){slasherAct();return}
  const it=interactTarget();
  if(!it)return;
  const qh=has('QUICK HANDS')?0.65:1;
  switch(it.k){
    case 'unhide':unhideP();break;
    case 'revive':startChan('revive',has('LEADER')?2:3,'REVIVING',{c:it.c});break;
    case 'drive':startChan('drive',2.5,'STARTING');break;
    case 'install':startChan('install',2.5*qh,'INSTALLING',{item:it.item});break;
    case 'fuse':startChan('fuse',2.5*qh,'FUSING');break;
    case 'restart':startChan('restart',3*qh,'RESTARTING');break;
    case 'call':startChan('call',3.5*qh,'CALLING');break;
    case 'gate':startChan('gate',3*qh,'UNLOCKING');break;
    case 'boatkey':startChan('boatkey',2*qh,'INSERTING');break;
    case 'boat':startChan('boat',3.5,'STARTING MOTOR');break;
    case 'hatch':startChan('hatch',2.5*qh,'UNLOCKING');break;
    case 'climb':startChan('climb',1.2,'CLIMBING');break;
    case 'search':startChan('search',CT[it.c.type].t*qh,'SEARCHING',{c:it.c});break;
    case 'hide':hideP(it.c);break;
    case 'ask':askNPC(it.c);break;
    case 'msg':msg(it.m);sfxBuzz();break;
    case 'attack':attack();break;
  }
}
function hideP(c){
  P.hide=c;c.occ=P;chan=null;sfxDoor();
  // if he watched you climb in, he knows
  const kd=Math.hypot(K.x-P.x,K.y-P.y);
  if(K.st==='CHASE'&&K.tgt===P&&kd<110&&sightLOS(K.x,K.y-8,P.x,P.y-6)){K.yank=c}
  else if(K.tgt===P){K.tgt=null;K.st='SEARCH';K.searchT=5;K.lkx=P.x;K.lky=P.y}
  P.x=c.ax;P.y=c.ay;
  msg('YOU HOLD YOUR BREATH.');
}
function unhideP(){
  if(!P.hide)return;
  P.hide.occ=null;P.x=P.hide.ax;P.y=P.hide.ay;P.hide=null;sfxDoor();
}
function attack(){
  if(P.atkCd>0)return;
  const kdx=K.x-P.x,kdy=K.y-P.y,dist=Math.hypot(kdx,kdy);
  if(!P.weapon){
    P.atkCd=0.4;
    if(dist<30)msg('YOU NEED A WEAPON!');
    return;
  }
  const w=WPN[P.weapon];P.atkCd=w.cd;P.swingT=0.18;sfxSlash();
  const dot=dist>0?(kdx/dist)*P.fx+(kdy/dist)*P.fy:1;
  if(K.st!=='DOWN'&&dist<24&&(dot>0.1||dist<13))hitKiller(w.d,kdx,kdy,dist);
  else if(K.st==='DOWN'&&dist<24)msg("HE'S NOT DEAD. HE'S NEVER DEAD.");
}
function wearWeapon(){
  P.wDur--;
  if(P.wDur<=0){msg('THE '+P.weapon+' BROKE!',2.5);sfxBreak();P.weapon=null;P.wDur=0}
}
function hitKiller(dmg,kdx,kdy,dist){
  if(K.fin){
    const f=K.fin;
    if(f.t<f.dur*f.hit){
      f.v.fin=false;K.fin=null;msg('YOU SAVED '+f.v.name+'!',3);
      say(f.v,'GET HIM OFF ME!');
    }
  }
  K.dmg+=dmg;K.stun=Math.max(K.stun,0.55);stats.hits++;
  blood(K.x,K.y-6,14+dmg*2);
  addStain(K.x+rr(-5,5),K.y+rr(0,8),rr(3,6));
  shake=Math.max(shake,3);noiseHit(0.25,0.12);
  if(dist>0)tryMove(K,kdx/dist*7,kdy/dist*7,4,6,!!S().water);
  if(P.weapon)wearWeapon();
  if(K.tgt!==P&&K.st!=='DOWN'){K.tgt=P;K.st='CHASE';K.lkx=P.x;K.lky=P.y}
  if(K.dmg>=K.thresh){
    K.st='DOWN';K.downT=11;K.dmg=0;K.thresh+=4;K.downs++;stats.downs++;K.sab=null;K.fin=null;
    blood(K.x,K.y,40,true);addStain(K.x,K.y,9);addStain(K.x+6,K.y+4,6);
    sfxDown();shake=6;
    msg("HE'S DOWN. HE WON'T STAY DOWN.",3);
  }
}
function count(k){return k==='LIGHT'?(P.torch?1:0):(P.c[k]||0)}
function autoSel(){
  if(count(CONS[P.sel])>0)return;
  for(let i=0;i<CONS.length;i++)if(count(CONS[i])>0){P.sel=i;return}
}
function cycleItem(){
  if(mode===1)return;
  for(let j=1;j<=CONS.length;j++){const n=(P.sel+j)%CONS.length;
    if(count(CONS[n])>0){P.sel=n;sfxSel();return}}
}
function useC(){
  if(state!==1||cine)return;
  if(mode===1){useSense();return}
  if(P.hide||P.down)return;
  autoSel();
  const k=CONS[P.sel];
  if(count(k)<=0){msg('NOTHING TO USE.');sfxBuzz();return}
  const kd=Math.hypot(K.x-P.x,K.y-P.y);
  switch(k){
    case 'MEDKIT':case 'BANDAGE':{
      if(P.hp>=P.maxhp){msg('YOU ARE NOT HURT.');return}
      P.c[k]--;
      const h=(k==='MEDKIT'?4:2)+(has('FIELD MEDIC')?2:0);
      P.hp=Math.min(P.maxhp,P.hp+h);sfxPickup();msg(k==='MEDKIT'?'PATCHED UP. +'+h:'BANDAGED. +'+h);
      break}
    case 'FLARE':{
      P.c.FLARE--;sfxFlare();
      let nx=P.fx,ny=P.fy;
      if(K.st!=='DOWN'&&kd<130&&kd>4){nx=(K.x-P.x)/kd;ny=(K.y-P.y)/kd}
      const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;
      shots.push({x:P.x+nx*6,y:P.y-4+ny*6,vx:nx*200,vy:ny*200,t:0.8});
      noise(P.x,P.y,150);
      break}
    case 'TRAP':
      P.c.TRAP--;traps.push({x:P.x,y:P.y+4});msg('TRAP SET.');sfxSnap();break;
    case 'FIRECRACKER':{
      P.c.FIRECRACKER--;
      let tx=P.x+P.fx*60,ty=P.y+P.fy*60;
      for(let s=60;s>10;s-=10){tx=P.x+P.fx*s;ty=P.y+P.fy*s;if(!solidAt(tx,ty,false))break}
      crackers.push({x:P.x,y:P.y,sx:P.x,sy:P.y,tx:tx,ty:ty,t:0,fuse:1.6});
      msg('THROWN. NOW GO.');sfxTick();
      break}
    case 'LIGHT':P.torchOn=!P.torchOn;sfxTick();msg(P.torchOn?'LIGHT ON.':'LIGHT OFF. HARDER TO SEE YOU.');break;
  }
  autoSel();
}

/* ---------------- ACTIONS: BE THE SLASHER ---------------- */
function kwReach(){return KW[P.wpn].rng+(has('LONG ARMS')?6:0)}
function slasherAct(){
  // finish someone who's down
  let fv=null,fd=22;
  for(const c of cons)if(c.down&&!c.dead&&!c.fin){const d2=Math.hypot(c.x-P.x,c.y-P.y);if(d2<fd){fd=d2;fv=c}}
  if(fv){beginPlayerFinisher(fv);return}
  // drag someone out of hiding
  for(const c of conts){
    if(c.occ&&c.occ!==P&&contDist(c,P)<16){
      const v=c.occ;v.hide=null;c.occ=null;v.x=c.ax;v.y=c.ay;
      sfxDoor();sfxScream();say(v,'NO NO NO!');
      hurtHuman(v,1,P.x,P.y);P.atkCd=0.6;return;
    }
  }
  // strike
  let best=null,bd=1e9;
  for(const c of cons){
    if(c.down||c.hide||c.dead)continue;
    const d2=Math.hypot(c.x-P.x,c.y-P.y);if(d2<bd){bd=d2;best=c}
  }
  const rng=kwReach();
  if(best&&bd<rng+4){
    if(P.atkCd>0)return;
    P.atkCd=KW[P.wpn].cd;P.swingT=0.2;sfxSlash();
    if(P.wpn==='CHAINSAW')sfxSawRev();
    const dot=bd>0?((best.x-P.x)/bd)*P.fx+((best.y-P.y)/bd)*P.fy:1;
    if(dot<0.05&&bd>13)return;
    const dmg=KW[P.wpn].d+(has('DEEP CUTS')?1:0)+(rageT>0?1:0);
    hurtHuman(best,dmg,P.x,P.y);
    return;
  }
  // sabotage
  const sab=has('SABOTEUR')?2:1;
  if(EX.car.on&&!EX.car.gone&&rectDist(P.x,P.y,car.x,car.y,48,16)<16){
    const inst=Object.keys(EX.car.parts).filter(k=>EX.car.parts[k]);
    if(inst.length){const it=pick(inst);EX.car.parts[it]=false;tossItem(car.cx,car.cy+20,it,T*8);
      msg('YOU TORE OUT THE '+it+' AND THREW IT.',3)}
    else{EX.car.dis=25*sab;msg('YOU GUTTED THE ENGINE.')}
    smoke(car.cx,car.y+4,12);sfxCrunch();P.atkCd=0.8;return;
  }
  if(gen.tx&&rectDist(P.x,P.y,gen.tx*T,gen.ty*T,T,T)<16&&EX.cops.power){
    EX.cops.power=false;smoke(gen.x,gen.y-6,12);sfxCrunch();msg('DARKNESS AGAIN.');P.atkCd=0.8;return;
  }
  if(phone.tx&&rectDist(P.x,P.y,phone.tx*T,phone.ty*T,T,T)<16&&!EX.cops.called&&EX.cops.cut<=0){
    EX.cops.cut=30*sab;smoke(phone.x,phone.y-6,8);sfxSnap();msg('THE LINE IS CUT.');P.atkCd=0.8;return;
  }
  if(EX.gate.on&&EX.gate.open&&rectDist(P.x,P.y,gate.tx*T,2*T,32,T+8)<18){
    EX.gate.open=false;EX.gate.on=false;tset(gate.tx,2,GT,1);tset(gate.tx+1,2,GT,1);
    sfxCrunch();msg('YOU CHAINED THE GATE SHUT. FOR GOOD.',3);P.atkCd=0.8;return;
  }
  if(EX.hatch.on&&EX.hatch.open&&Math.hypot(P.x-hatch.x,P.y-hatch.y)<20){
    EX.hatch.open=false;EX.hatch.on=false;sfxCrunch();msg('YOU SLAMMED THE HATCH AND WEDGED IT.',3);P.atkCd=0.8;return;
  }
  if(EX.gate.on&&!EX.gate.open&&EX.gate.jam<=0&&rectDist(P.x,P.y,gate.tx*T,2*T,32,T)<18){
    EX.gate.jam=35*sab;sfxCrunch();msg('YOU JAMMED THE LOCK.');P.atkCd=0.8;return;
  }
  if(EX.boat.on&&!EX.boat.gone&&EX.boat.dis<=0&&Math.hypot(P.x-boat.ax,P.y-boat.ay)<22){
    if(EX.boat.key){EX.boat.key=false;tossItem(boat.ax,boat.ay,'BOAT KEY',T*7);msg('YOU YANKED THE BOAT KEY AND HURLED IT.',3)}
    else{EX.boat.dis=30*sab;msg('YOU FLOODED THE MOTOR.')}
    sfxCrunch();P.atkCd=0.8;return;
  }
  if(P.atkCd<=0){P.atkCd=KW[P.wpn].cd;P.swingT=0.2;sfxSlash();if(P.wpn==='CHAINSAW')sfxSawRev()}
}
function usePower(){
  if(state!==1||mode!==1||powerCd>0||cine)return;
  const s=S(),cd=s.pcd*(has('RELENTLESS')?0.65:1);
  const live=cons.filter(c=>!c.dead&&!c.escaped&&!c.down);
  if(s.power==='VANISH'){
    if(!live.length)return;
    const c=pick(live);
    for(let tr=0;tr<50;tr++){
      const a=Math.random()*Math.PI*2,d2=60+Math.random()*40;
      const nx=c.x+Math.cos(a)*d2,ny=c.y+Math.sin(a)*d2;
      if(nx>3*T&&ny>3*T&&nx<WPX-3*T&&ny<HPX-5*T&&freeBox(nx,ny,4,6,false)){
        smoke(P.x,P.y-6,12);P.x=nx;P.y=ny;smoke(P.x,P.y-6,12);
        sfxSting();powerCd=cd;return;
      }
    }
  }else if(s.power==='LUNGE'){lungeT=0.4;powerCd=cd;sfxPower()}
  else if(s.power==='BURN'){
    for(let i=0;i<8;i++){const a=i/8*Math.PI*2;fires.push({x:P.x+Math.cos(a)*18,y:P.y+Math.sin(a)*18,t:7})}
    powerCd=cd;sfxPower();noiseHit(0.2,0.3);
  }else if(s.power==='RAGE'){rageT=3;powerCd=cd;sfxSawRev();shake=3;msg('RAGE.')}
}
function useSense(){
  if(senseCd>0){sfxBuzz();return}
  senseT=4;senseCd=has('BLOODHOUND')?10:20;sfxWhisper();
}
function hurtHuman(c,dmg,fromX,fromY){
  c.hp-=dmg;c.hurtCd=0.5;c.fleeT=4;c.act=null;
  const dx=c.x-fromX,dy=c.y-fromY,m=Math.hypot(dx,dy)||1;
  blood(c.x,c.y-4,14+dmg*6);spurt(c.x,c.y,6,dx/m,6,40);
  addStain(c.x,c.y+3,rr(3,6));
  shake=Math.max(shake,3);sfxScream();sfxSquish();
  noise(c.x,c.y,220,1);
  c.alarmed=true;
  tryMove(c,dx/m*9,dy/m*9,4,5,false);

  if(c.hp<=0)downHuman(c);
}
function downHuman(c){
  c.hp=0;c.down=true;c.downT=mode===1?24:28;c.act=null;c.goal=null;
  if(c.hide){c.hide.occ=null;c.hide=null}
  blood(c.x,c.y,30,true);addStain(c.x,c.y,7);
  sfxDown();shake=Math.max(shake,5);
  // anything heavy hits the dirt
  for(const it of c.inv.splice(0))tossItem(c.x,c.y,it,20);
  if(c.weapon){dropAt(c.x-6,c.y+6,c.weapon,1);c.weapon=null}
  msg(c.name+' IS DOWN!',2.5);
}
function killHuman(c,kind,dir){
  c.dead=true;c.down=false;c.fin=false;
  if(c.hide){c.hide.occ=null;c.hide=null}
  for(const it of c.inv.splice(0))tossItem(c.x,c.y,it,24);
  if(c.weapon){dropAt(c.x-6,c.y+6,c.weapon,1);c.weapon=null}
  if(c.med>0&&mode===0)dropAt(c.x+6,c.y+4,'MEDKIT',1);
  corpses.push({x:c.x,y:c.y,found:true,name:c.name,shirt:c.shirt,hair:c.hair,pants:c.pants,
    skin:c.skin,kind:kind||'whole',dir:dir||1});
  addStain(c.x,c.y,10);addStain(c.x-6,c.y+4,6);addStain(c.x+6,c.y-3,5);
  const list=humans(),i=list.indexOf(c);if(i>=0)list.splice(i,1);
  for(const k in tasks)if(tasks[k]===c)tasks[k]=null;
  for(const cc of conts)if(cc.claim===c)cc.claim=null;
  if(mode===1){
    stats.kills++;save.kills++;writeSave();
    checkSlasherEnd();
  }else msg(c.name+' IS DEAD.',2.8);
}

/* ---------------- FINISHERS ---------------- */
function beginPlayerFinisher(v){
  const kind=KW[P.wpn].fin;
  const f=makeFin(P,v,kind,true,P.wpn);
  cine=f;P.atkCd=0.5;
}
function makeFin(kEnt,v,kind,isCine,wpn){
  const dir=v.x>=kEnt.x?1:-1;
  const f={kind:kind,t:0,dur:FIN[kind].dur,hit:FIN[kind].hit,v:v,vx:v.x,vy:v.y,dir:dir,
    kx:v.x-dir*11,ky:v.y,cine:!!isCine,ev:{},wpn:wpn,s:S(),byP:kEnt===P,
    shirt:v.shirt,hair:v.hair,pants:v.pants,skin:v.skin,cuts:0,lift:0};
  v.fin=true;
  if(isCine){
    f.title=FIN[kind].name;
    shake=0;
  }
  return f;
}
function finEv(f,p,key){if(f.t/f.dur>=p&&!f.ev[key]){f.ev[key]=1;return true}return false}
function updateFin(f,dt){
  f.t+=dt;
  const p=f.t/f.dur,x=f.vx,y=f.vy,d=f.dir;
  switch(f.kind){
    case 'DECAPITATE':
      if(finEv(f,0.1,'raise'))beep(300,0.3,'sawtooth',0.06,300);
      if(finEv(f,f.hit,'cut')){sfxChop();sfxGore();shake=6;
        gib(x,y,11,'head',f.hair,f.skin,d*rr(55,85),rr(-12,12),rr(110,150));
        spurt(x,y,9,d,14,50,120)}
      if(p>f.hit&&p<0.85&&Math.random()<0.8)spurt(x,y,9,rr(-0.3,0.3),2,30,rr(110,170));
      if(finEv(f,0.62,'fall')){sfxDown();addStain(x,y,8)}
      break;
    case 'FILLET':
      for(const [q,k] of [[0.22,'c1'],[0.36,'c2'],[0.5,'c3']])
        if(finEv(f,q,k)){f.cuts++;sfxSlash();sfxSquish();spurt(x,y,6,d,10,45,50);shake=3}
      if(finEv(f,0.64,'open')){sfxGore();shake=5;
        for(let i=0;i<6;i++)gib(x,y,5,'organ',pick(['#d86a7a','#a01818','#5a0a0a','#e88a9a']),null,rr(-30,30)+d*20,rr(-10,14),rr(30,80));
        for(let i=0;i<2;i++)gib(x,y,4,'gut','#d87a8a',null,d*rr(15,40),rr(0,12),rr(20,50));
        blood(x,y,30,true)}
      if(finEv(f,0.82,'fall')){sfxDown();addStain(x,y,8)}
      break;
    case 'SKULL SPLIT':
      if(finEv(f,0.12,'raise'))beep(200,0.3,'sawtooth',0.06,200);
      if(finEv(f,f.hit,'chop')){sfxChop();sfxCrush();shake=7;
        spurt(x,y,10,0,24,20,140);
        for(let i=0;i<3;i++)gib(x,y,10,'bone','#e8e0d0',null,rr(-40,40),rr(-10,10),rr(60,110))}
      if(p>f.hit&&p<0.72&&Math.random()<0.4)spurt(x,y,8,0,1,10,40);
      if(finEv(f,0.72,'yank')){sfxSquish();spurt(x,y,9,-d,12,50,80)}
      if(finEv(f,0.78,'fall')){sfxDown();addStain(x,y,8)}
      break;
    case 'HEAD CRUSH':
      if(finEv(f,0.12,'raise'))beep(160,0.35,'sawtooth',0.06,160);
      if(finEv(f,f.hit,'slam')){sfxCrush();sfxGore();shake=10;
        blood(x,y-2,60,true,20);
        for(let i=0;i<6;i++)gib(x,y,5,'bone','#e8e0d0',null,rr(-60,60),rr(-25,25),rr(40,90));
        gib(x,y,4,'organ','#c8a0a0',null,rr(-30,30),rr(-10,10),40);
        addStain(x+d*4,y-2,9)}
      if(finEv(f,0.6,'fall')){sfxDown();addStain(x,y,8)}
      break;
    case 'IMPALE':
      if(finEv(f,f.hit,'stab')){sfxChop();sfxGore();shake=5;spurt(x,y,7,d,22,60,60)}
      if(p>f.hit&&p<0.72){f.lift=Math.min(12,(p-f.hit)/0.25*12);
        if(Math.random()<0.5)parts.push({k:'B',x:x+rr(-2,2),y:y,z:f.lift+4,vx:0,vy:0,vz:0,life:2})}
      if(finEv(f,0.72,'toss')){sfxSquish();shake=4;f.tossed=true;
        gib(x,y,12,'body',f.shirt,f.pants,d*rr(80,100),rr(-10,10),70,
          {corpse:{name:f.v.name,shirt:f.shirt,hair:f.hair,pants:f.pants,skin:f.skin,kind:'impaled',dir:d},skin:f.skin,hair:f.hair})}
      break;
    case 'BISECT':
      if(finEv(f,f.hit,'start'))sfxSawRev();
      if(p>f.hit&&p<0.62){
        if(Math.random()<0.9)spurt(x,y,5,Math.random()<0.5?d:-d,2,60,40);
        if(Math.random()<0.4)sparks(x-d*2,y-5,1,'#ffe0a0');
        shake=Math.max(shake,1.5);
        f.sawT=(f.sawT||0)-dt;if(f.sawT<=0){f.sawT=0.14;noiseF(0.12,0.12,2400,'bandpass')}
      }
      if(finEv(f,0.62,'split')){sfxGore();shake=6;
        gib(x,y,8,'torso',f.shirt,f.skin,d*rr(30,50),rr(-6,6),70,{hair:f.hair});
        for(let i=0;i<4;i++)gib(x,y,4,'organ',pick(['#d86a7a','#a01818','#5a0a0a']),null,rr(-30,30),rr(-10,10),rr(30,70));
        gib(x,y,3,'gut','#d87a8a',null,d*20,4,30);
        blood(x,y,30,true)}
      break;
  }
  if(f.t>=f.dur)endFin(f);
}
function endFin(f){
  const v=f.v,d=f.dir;
  const kind={'DECAPITATE':'headless','FILLET':'gutted','SKULL SPLIT':'split','HEAD CRUSH':'crushed',
    'IMPALE':null,'BISECT':'legs'}[f.kind];
  if(v===P){
    P.fin=false;
    if(kind)corpses.push({x:P.x,y:P.y,found:true,name:'YOU',shirt:P.shirt,hair:P.hair,pants:P.pants,
      skin:P.skin,kind:kind,dir:d});
    addStain(P.x,P.y,11);
    if(f===cine)cine=null;
    K.fin=null;
    loseNight('KILLED');
    return;
  }
  if(f.byP){stats.fins++;save.fins++;}
  // a toss leaves the corpse wherever the body gib lands
  if(kind)killHuman(v,kind,d);
  else{killHuman(v,'whole',d);corpses.pop()}
  if(f.byP){
    if(has('BUTCHERS PRIDE'))P.hp=Math.min(P.maxhp,P.hp+4);
    // the ones who saw it break
    const r=has('BUTCHERS PRIDE')?210:140;
    for(const c of cons){
      if(c.down||c.dead)continue;
      const dd=Math.hypot(c.x-f.vx,c.y-f.vy);
      if(dd<r&&sightLOS(c.x,c.y-6,f.vx,f.vy-6)){
        c.fleeT=5;c.panic=3;c.act=null;
        say(c,pick(['OH GOD!','NO! NO!','HE KILLED '+v.name+'!','RUN!']),2.5);
        if(c.inv.length&&(has('BUTCHERS PRIDE')||Math.random()<0.5)){
          const it=c.inv.shift();tossItem(c.x,c.y,it,16);msg(c.name+' DROPPED THE '+it+'!',2.5);
        }
      }
    }
    P.x=f.kx;P.y=f.ky;unstick(P,4,6,!!S().water);
  }else if(K.fin===f){
    K.fin=null;K.x=f.kx;K.y=f.ky;unstick(K,4,6,!!S().water);K.stun=0.6;
  }
  if(f===cine)cine=null;
}

/* ---------------- COUNSELOR AI (both modes) ---------------- */
function threat(){
  if(mode===0)return{x:K.x,y:K.y,on:K.st!=='DOWN',busy:!!K.fin};
  return{x:P.x,y:P.y,on:true,busy:!!cine};
}
function releaseGoal(c){
  const g=c.goal;if(!g)return;
  if(g.ref&&g.ref.claim===c)g.ref.claim=null;
  if(g.task&&tasks[g.task]===c)tasks[g.task]=null;
}
function setGoal(c,g){
  const o=c.goal;
  if(o&&o.k===g.k&&o.ref===g.ref&&o.ex===g.ex&&o.item===g.item){
    if(g.k==='FLEE'){o.x=g.x;o.y=g.y}
    return;
  }
  releaseGoal(c);
  c.goal=g;c.waitT=0;
  if(g.ref&&(g.k==='SEARCH'||g.k==='PICKUP'))g.ref.claim=c;
}
function claimTask(name,c){
  const o=tasks[name];
  if(!o||o===c||o.dead||o.down||o.escaped||o.hide){tasks[name]=c;return true}
  return false;
}
function useGoal(it){
  if(EX.car.parts[it]===false&&EX.car.on&&!EX.car.gone)
    return{k:'INSTALL',x:car.ax,y:car.ay,item:it,dur:3};
  if(it==='FUSE'&&EX.cops.on&&!EX.cops.fuse&&gen.tx)return{k:'FUSE',x:gen.ax,y:gen.ay,item:it,dur:2.5};
  if(it==='GATE KEY'&&EX.gate.on&&!EX.gate.open&&EX.gate.jam<=0)return{k:'GATE',x:gate.ax,y:gate.ay,item:it,dur:3};
  if(it==='BOAT KEY'&&EX.boat.on&&!EX.boat.gone&&!EX.boat.key)return{k:'BOATKEY',x:boat.ax,y:boat.ay,item:it,dur:2.5};
  if(it==='HATCH KEY'&&EX.hatch.on&&EX.hatch.found&&!EX.hatch.open)return{k:'HATCH',x:hatch.x,y:hatch.y,item:it,dur:2.5};
  return null;
}
function nearestReadyExit(c){
  const o=[];
  if(EX.cops.here)o.push({k:'COPS',x:copSpot.x,y:copSpot.y});
  if(EX.gate.open)o.push({k:'GATE',x:gate.outX,y:gate.outY});
  if(EX.hatch.open&&EX.hatch.found)o.push({k:'HATCH',x:hatch.x,y:hatch.y});
  if(carReady())o.push({k:'CAR',x:car.ax,y:car.ay});
  if(boatReady())o.push({k:'BOAT',x:boat.ax,y:boat.ay});
  let b=null,bd=1e9;
  for(const e of o){const d=Math.hypot(e.x-c.x,e.y-c.y);if(d<bd){bd=d;b=e}}
  return b;
}
function downedNear(c,th){
  const list=humans().filter(h=>h!==c&&h.down&&!h.dead&&!h.fin);
  if(mode===0&&P.down&&!P.fin)list.push(P);
  let b=null,bd=320;
  for(const h of list){
    const d=Math.hypot(h.x-c.x,h.y-c.y);
    if(th.on&&!th.busy&&Math.hypot(th.x-h.x,th.y-h.y)<80)continue;
    if(d<bd){bd=d;b=h}
  }
  return b;
}
function usefulPickup(c,th){
  let b=null,bd=520;
  for(const pk of pickups){
    if(pk.t>0||(pk.claim&&pk.claim!==c&&!pk.claim.dead))continue;
    let want=false;
    if(IT[pk.item].q)want=c.inv.length<2&&!!useGoal(pk.item);
    else if(pk.item==='MEDKIT'||pk.item==='BANDAGE')want=c.hp<c.maxhp;
    else if(IT[pk.item].w)want=!c.weapon;
    if(!want)continue;
    if(th.on&&Math.hypot(th.x-pk.x,th.y-pk.y)<90)continue;
    const d=Math.hypot(pk.x-c.x,pk.y-c.y);
    if(!IT[pk.item].q&&d>200)continue;
    if(d<bd){bd=d;b=pk}
  }
  return b;
}
function bestCont(c,th){
  let b=null,bs=1e9;
  const others=humans().filter(h=>h!==c&&h.goal&&h.goal.ref);
  for(const ct of conts){
    if(ct.searched||ct.occ)continue;
    if(ct.claim&&ct.claim!==c&&!ct.claim.dead&&!ct.claim.escaped)continue;
    let s=Math.hypot(ct.ax-c.x,ct.ay-c.y);
    if(th.on&&Math.hypot(th.x-ct.ax,th.y-ct.ay)<110)s+=500;
    for(const o of others)if(Math.hypot(o.goal.ref.x-ct.x,o.goal.ref.y-ct.y)<70)s+=110;
    s+=((ct.tx*7+ct.ty*3+c.name.length*13)%40);
    if(s<bs){bs=s;b=ct}
  }
  return b;
}
function nearestHide(c,r,th){
  let b=null,bd=r;
  for(const ct of conts){
    if(!ct.hide||ct.occ||(ct.claim&&ct.claim!==c))continue;
    const d=Math.hypot(ct.ax-c.x,ct.ay-c.y);
    if(th&&th.on&&Math.hypot(th.x-ct.ax,th.y-ct.ay)<140)continue;
    if(d<bd){bd=d;b=ct}
  }
  return b;
}
function fleePoint(c,th){
  let best=null,bs=-1e9;
  const base=Math.hypot(c.x-th.x,c.y-th.y);
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2+Math.random()*0.3;
    for(const r of [90,50]){
      const x=c.x+Math.cos(a)*r,y=c.y+Math.sin(a)*r;
      if(!freeBox(x,y,4,5,false))continue;
      let s=Math.hypot(x-th.x,y-th.y)-base;
      if(!walkLOS(c.x,c.y,x,y,false))s-=50;
      if(buildingAt(x,y))s-=35;
      if(mode===0&&P.weapon&&!P.down&&!P.hide)s-=Math.hypot(x-P.x,y-P.y)*0.12;
      s+=Math.random()*12;
      if(s>bs){bs=s;best={x:x,y:y}}
      break;
    }
  }
  return best||{x:c.x+(c.x-th.x),y:c.y+(c.y-th.y)};
}
function decide(c,th,td){
  const sees=th.on&&td<160&&(td<30||sightLOS(c.x,c.y-6,th.x,th.y-6));
  if(sees&&td<(th.busy?50:115))c.fleeT=Math.max(c.fleeT,2.5);
  if(c.fleeT>0&&th.on&&td<185&&!(th.busy&&td>55)){
    if(td<80&&c.hp<=Math.ceil(c.maxhp/2)){
      const hi=c.inv.findIndex(it=>IT[it].heavy);
      if(hi>=0){const it=c.inv.splice(hi,1)[0];tossItem(c.x,c.y,it,14,6);
        announce(c,'DROPPED THE '+it+'! RUNNING!',2.5)}
    }
    if(mode===0&&c.inv.length&&!P.down&&!P.hide&&Math.hypot(c.x-P.x,c.y-P.y)<56&&c.sayCd<=0){
      const got=c.inv.splice(0);for(const it of got)P.q.push(it);
      announce(c,'TAKE THE '+got.join(' AND ')+'! GO!',3);sfxKeyItem();c.sayCd=4;
    }
    if(!sees&&td>80&&Math.random()<0.25){
      const h=nearestHide(c,100,th);
      if(h){setGoal(c,{k:'HIDE',x:h.ax,y:h.ay,ref:h});return}
    }
    if(c.sayCd<=0&&sees){say(c,pick(["HE'S HERE!",'RUN!','OH GOD!','HELP!','THIS WAY!']));c.sayCd=5}
    const fp=fleePoint(c,th);
    setGoal(c,{k:'FLEE',x:fp.x,y:fp.y});return;
  }
  if(c.hp<c.maxhp&&c.med>0&&td>140){setGoal(c,{k:'HEAL',x:c.x,y:c.y,dur:2.5});return}
  const dn=downedNear(c,th);
  if(dn){setGoal(c,{k:'REVIVE',x:dn.x,y:dn.y,ref:dn,dur:3.5});return}
  const ex=nearestReadyExit(c);
  if(ex){setGoal(c,{k:'ESCAPE',x:ex.x,y:ex.y,ex:ex.k});return}
  for(const it of c.inv){const g=useGoal(it);if(g){setGoal(c,g);return}}
  if(EX.cops.on&&EX.cops.fuse&&!EX.cops.power&&gen.tx&&claimTask('gen',c)){
    setGoal(c,{k:'RESTART',x:gen.ax,y:gen.ay,dur:3.5,task:'gen'});return}
  if(EX.cops.on&&EX.cops.power&&!EX.cops.called&&EX.cops.cut<=0&&phone.tx&&claimTask('phone',c)){
    setGoal(c,{k:'CALL',x:phone.ax,y:phone.ay,dur:4,task:'phone'});return}
  const pk=usefulPickup(c,th);
  if(pk){setGoal(c,{k:'PICKUP',x:pk.x,y:pk.y,ref:pk});return}
  const ct=bestCont(c,th);
  if(ct){setGoal(c,{k:'SEARCH',x:ct.ax,y:ct.ay,ref:ct,
    dur:CT[ct.type].t*(mode===1?D().cSearch:1.3)});return}
  if(mode===0&&!P.down&&!P.hide){setGoal(c,{k:'FOLLOW'});return}
  const h=nearestHide(c,500,th);
  if(h&&Math.random()<0.6){setGoal(c,{k:'HIDE',x:h.ax,y:h.ay,ref:h});return}
  if(!c.goal||c.goal.k!=='ROAM')setGoal(c,{k:'ROAM'});
}
function alarm(c,why){
  c.alarmed=true;c.fleeT=Math.max(c.fleeT,2);c.goal=null;c.think=0;
  say(c,why,2.5);
  // word spreads to anyone close enough to hear
  for(const o of humans())if(o!==c&&!o.alarmed&&Math.hypot(o.x-c.x,o.y-c.y)<140){o.alarmed=true;say(o,'WHAT?!')}
}
const CHATTER=['ANYONE GOT A LIGHTER?',"WHERE'D EVERYONE GO?",'THIS PLACE IS CREEPY.','HELLO?',
  'I HEARD THIS CAMP WAS CLOSED.','S\'MORES LATER?','DID YOU HEAR THAT?','SO QUIET OUT HERE.'];
function calmUpdate(c,dt){
  if(!c.goal||c.goal.k!=='ROAM')c.goal={k:'ROAM'};
  const g=c.goal;
  if(!g.tx||Math.hypot(g.tx-c.x,g.ty-c.y)<10||(g.t=(g.t||0)+dt)>14){
    const s=openSpot(4,MH-6);g.tx=s.x;g.ty=s.y;g.t=0;g.idle=rr(1,4);
  }
  if(g.idle>0&&Math.hypot(g.tx-c.x,g.ty-c.y)<12){g.idle-=dt;c.moving=false}
  else{navTo(c,g.tx,g.ty,dt,26,false);c.walkT+=dt*5}
  if(c.sayCd<=0&&Math.random()<dt*0.04){say(c,pick(CHATTER),2.5);c.sayCd=12}
}
function npcTakePickup(c,pk){
  const it=pk.item;
  if(IT[it].q){if(c.inv.length>=2)return false;c.inv.push(it);announce(c,'GOT THE '+it+'!');return true}
  if(it==='MEDKIT'||it==='BANDAGE'){if(mode===0&&c.hp>=c.maxhp)return false;c.med++;return true}
  if(IT[it].w){if(c.weapon)return false;c.weapon=it;c.wDur=3;say(c,'GOT A '+it+'.');return true}
  return false;
}
function unhideH(c){
  if(!c.hide)return;
  c.hide.occ=null;c.x=c.hide.ax;c.y=c.hide.ay;c.hide=null;c.goal=null;c.think=0;
}
function escapeHuman(c,how){
  if(c.escaped)return;
  c.escaped=true;c.act=null;releaseGoal(c);
  if(c.hide){c.hide.occ=null;c.hide=null}
  const list=humans(),i=list.indexOf(c);if(i>=0)list.splice(i,1);
  for(const k in tasks)if(tasks[k]===c)tasks[k]=null;
  stats.escaped++;
  if(mode===0){escapedNames.push(c.name);msg(c.name+' GOT OUT ('+how+').',3)}
  else{msg(c.name+' ESCAPED BY '+how+'!',3);sfxBuzz();checkSlasherEnd()}
}
function vehicleLeave(kind,driver){
  const ox=kind==='CAR'?car.cx:boat.ax,oy=kind==='CAR'?car.cy:boat.ay;
  if(mode===0&&!P.down&&!P.hide&&Math.hypot(P.x-ox,P.y-oy)<70){winNight(kind);return}
  const riders=humans().filter(h=>!h.down&&!h.dead&&!h.hide&&Math.hypot(h.x-ox,h.y-oy)<90);
  if(kind==='CAR'){EX.car.gone=true;sfxEngine()}else{EX.boat.gone=true;sfxEngine()}
  if(mode===0)msg(driver.name+(kind==='CAR'?' DROVE OFF WITHOUT YOU!':' TOOK THE BOAT WITHOUT YOU!'),3.5);
  for(const h of riders)escapeHuman(h,kind);
}
function fightBack(c){
  const w=WPN[c.weapon];
  c.atkCd=1.1;c.swingT=0.2;
  if(mode===0){
    damageKiller(w.d,c.x,c.y);

    P.hurtCd=0.6;P.hp-=w.d;

  }
